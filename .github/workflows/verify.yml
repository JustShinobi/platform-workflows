name: Reusable application verification

on:
  workflow_call:
    inputs:
      descriptor:
        description: Repository-relative application descriptor
        required: false
        default: .ci/application.yaml
        type: string

permissions:
  contents: read

concurrency:
  group: verify-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ARC
    runs-on: arc-k3s
    timeout-minutes: 30
    steps:
      - name: Check out application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate delivery contract
        uses: JustShinobi/platform-workflows/.github/actions/descriptor@v1
        with:
          descriptor: ${{ inputs.descriptor }}

      - name: Set up Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Run repository verification contract
        shell: bash
        run: |
          set -euo pipefail
          test -x scripts/ci/verify
          scripts/ci/verify
