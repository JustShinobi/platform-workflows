name: Reusable application verification

on:
  workflow_call:
    inputs:
      descriptor:
        description: Repository-relative application descriptor
        required: false
        default: .ci/application.yaml
        type: string

concurrency:
  group: verify-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - name: Check out application
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Validate delivery contract
        uses: JustShinobi/platform-workflows/.github/actions/descriptor@v1
        with:
          descriptor: ${{ inputs.descriptor }}

      - name: Detect a Node dependency cache
        id: node_cache
        shell: bash
        run: |
          set -euo pipefail
          # `actions/setup-node` fails outright when `cache` is set and no
          # lockfile matches at the repository root. A repository whose Node
          # workspace lives in a subdirectory has nothing to match and cannot be
          # verified at all, which is a cache optimisation deciding whether CI
          # runs.
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
            echo "kind=npm" >> "$GITHUB_OUTPUT"
          else
            echo "kind=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js runtime
        uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85 # v4.2.0
        with:
          node-version: '24'
          cache: ${{ steps.node_cache.outputs.kind }}

      - name: Next.js and build cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v4.2.0
        with:
          path: |
            apps/admin/.next/cache
            ~/.npm
          key: ${{ runner.os }}-build-${{ matrix.task }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.task }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Run verification task
        shell: bash
        env:
          TASK: ${{ matrix.task }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          set -euo pipefail
          if [[ -x "scripts/ci/$TASK" ]]; then
            "scripts/ci/$TASK"
          elif npm run | grep -q "^  $TASK$"; then
            npm run "$TASK"
          else
            echo "Task $TASK not found as script or npm run target, skipping."
          fi
