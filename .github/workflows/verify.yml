name: Reusable application verification

on:
  workflow_call:
    inputs:
      descriptor:
        description: Repository-relative application descriptor
        required: false
        default: .ci/application.yaml
        type: string
      RUNS_ON:
        description: Runner type
        required: false
        type: string
        default: arc-k3s

jobs:
  verify:
    name: Verify (${{ matrix.task }})
    runs-on: ${{ inputs.RUNS_ON || 'arc-k3s' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - name: Check out application
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v4.2.2

      - name: Validate delivery contract
        uses: JustShinobi/platform-workflows/.github/actions/descriptor@v1
        with:
          descriptor: ${{ inputs.descriptor }}

      - name: Detect the Node package manager
        id: node_cache
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "kind=pnpm" >> "$GITHUB_OUTPUT"
            echo "path=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "kind=yarn" >> "$GITHUB_OUTPUT"
            echo "path=yarn.lock" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "kind=npm" >> "$GITHUB_OUTPUT"
            if [ -f package-lock.json ]; then
              echo "path=package-lock.json" >> "$GITHUB_OUTPUT"
            else
              echo "path=npm-shrinkwrap.json" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "kind=" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js runtime
        uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85 # v4.2.0
        with:
          node-version: '24'
          cache: ${{ steps.node_cache.outputs.kind }}
          cache-dependency-path: ${{ steps.node_cache.outputs.path }}

      - name: Next.js and build cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v4.2.0
        with:
          path: |
            apps/admin/.next/cache
            ~/.npm
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-build-${{ matrix.task }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.task }}-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock') }}-

      - name: Install dependencies
        shell: bash
        env:
          PACKAGE_MANAGER: ${{ steps.node_cache.outputs.kind }}
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
            pnpm)
              corepack enable
              pnpm install --frozen-lockfile
              ;;
            yarn)
              corepack enable
              yarn install --immutable
              ;;
            npm)
              npm ci
              ;;
            *)
              echo "No supported lockfile found; dependency installation is delegated to the repository contract."
              ;;
          esac

      - name: Run verification task
        shell: bash
        env:
          TASK: ${{ matrix.task }}
          PACKAGE_MANAGER: ${{ steps.node_cache.outputs.kind }}
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          set -euo pipefail
          if [[ -x "scripts/ci/$TASK" ]]; then
            "scripts/ci/$TASK"
          elif [[ -n "$PACKAGE_MANAGER" ]] && node -e 'const s=require("./package.json").scripts||{}; process.exit(s[process.env.TASK] ? 0 : 1)'; then
            "$PACKAGE_MANAGER" run "$TASK"
          else
            echo "Task $TASK not found as script or package-manager target, skipping."
          fi
