name: Build and Push Helm Chart OCI

on:
  workflow_call:
    inputs:
      CHART_PATH:
        description: Path to the Helm chart directory
        required: false
        type: string
        default: 'chart'
      REGISTRY_URL:
        description: Target OCI Registry URL (e.g., registry.lan.kyo.ninja)
        required: false
        type: string
        default: 'registry.lan.kyo.ninja'
      REGISTRY_NAMESPACE:
        description: Namespace/repository path in the registry
        required: false
        type: string
        default: 'charts'
      RUNS_ON:
        description: Runner type
        required: false
        type: string
        default: 'arc-k3s'
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build-and-push-chart:
    name: Package & Push Helm Chart
    runs-on: arc-k3s
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'latest'

      - name: Helm Registry Login
        if: secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != ''
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | helm registry login "${{ inputs.REGISTRY_URL }}" --username "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

      - name: Use mounted Zot credentials when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /run/secrets/zot/config.json ]; then
            printf 'HELM_REGISTRY_CONFIG=%s\n' /run/secrets/zot/config.json >> "$GITHUB_ENV"
          fi

      - name: Build Chart Dependencies
        run: |
          if [ -f "${{ inputs.CHART_PATH }}/Chart.yaml" ]; then
            helm dependency build "${{ inputs.CHART_PATH }}" || true
          else
            echo "::error::Chart.yaml not found at ${{ inputs.CHART_PATH }}"
            exit 1
          fi

      - name: Package Chart
        id: package
        run: |
          PACKAGE_OUTPUT=$(helm package "${{ inputs.CHART_PATH }}")
          PACKAGE_FILE=$(echo "$PACKAGE_OUTPUT" | awk '{print $NF}')
          echo "PACKAGE_FILE=$PACKAGE_FILE" >> $GITHUB_ENV
          echo "Package created at: $PACKAGE_FILE"

      - name: Push Chart to OCI Registry
        run: |
          REGISTRY_TARGET="oci://${{ inputs.REGISTRY_URL }}/${{ inputs.REGISTRY_NAMESPACE }}"
          echo "Pushing $PACKAGE_FILE to $REGISTRY_TARGET..."
          helm push "$PACKAGE_FILE" "$REGISTRY_TARGET"
          echo "Successfully pushed $PACKAGE_FILE to $REGISTRY_TARGET"
