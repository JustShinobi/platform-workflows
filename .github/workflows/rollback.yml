name: Reusable GitOps rollback

on:
  workflow_call:
    inputs:
      descriptor:
        required: false
        default: .ci/application.yaml
        type: string
      environment:
        description: stg or prod
        required: true
        type: string
      revision:
        description: Full GitOps commit SHA whose image patch must be restored
        required: true
        type: string
    secrets:
      PLATFORM_GITOPS_TOKEN:
        required: false
      GITOPS_APP_ID:
        required: false
      GITOPS_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: rollback-${{ github.repository }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Prepare ${{ inputs.environment }} rollback
    runs-on: arc-k3s-light
    timeout-minutes: 15
    environment: ${{ inputs.environment == 'prod' && 'production-rollback' || 'staging-rollback' }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Validate delivery contract
        id: descriptor
        uses: JustShinobi/platform-workflows/.github/actions/descriptor@25737ffd3db33a4492eba241cddb3c1893ff526a
        with:
          descriptor: ${{ inputs.descriptor }}

      - name: Validate rollback request
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          [[ "$TARGET_ENVIRONMENT" == stg || "$TARGET_ENVIRONMENT" == prod ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]

      - name: Select bounded target
        id: target
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          BASE_BRANCH: ${{ steps.descriptor.outputs.gitops_base_branch }}
          STAGING_PATH: ${{ steps.descriptor.outputs.gitops_staging_path }}
          PRODUCTION_PATH: ${{ steps.descriptor.outputs.gitops_production_path }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_ENVIRONMENT" == stg ]]; then
            printf 'branch=%s\npath=%s\n' "$BASE_BRANCH" "$STAGING_PATH" >> "$GITHUB_OUTPUT"
          else
            printf 'branch=%s\npath=%s\n' "$BASE_BRANCH" "$PRODUCTION_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve GitOps authentication token (GitHub App or PAT fallback)
        id: gitops_token
        shell: bash
        env:
          GITOPS_TOKEN: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
          GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
          GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          GITOPS_REPO: ${{ steps.descriptor.outputs.gitops_repository }}
        run: |
          set -euo pipefail
          if [ -n "${GITOPS_APP_ID}" ] && [ -n "${GITOPS_APP_PRIVATE_KEY}" ]; then
            TOKEN="$(python3 - <<'PY'
          import base64, json, os, subprocess, time, urllib.request
          def b64url(b: bytes) -> str:
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          app_id = os.environ["GITOPS_APP_ID"].strip()
          priv_key = os.environ["GITOPS_APP_PRIVATE_KEY"].strip()
          owner = os.environ.get("GITOPS_REPO", "Shhinobi/k3s-gitops-prod").split("/", 1)[0]
          now = int(time.time())
          h = b64url(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
          p = b64url(json.dumps({"iat": now - 60, "exp": now + 300, "iss": app_id}).encode())
          proc = subprocess.run(
              ["bash", "-c", 'openssl dgst -sha256 -sign <(printf "%s" "$PRIV_KEY")'],
              input=f"{h}.{p}".encode(),
              env={"PRIV_KEY": priv_key, "PATH": "/usr/bin:/bin"},
              capture_output=True,
              check=True,
          )
          jwt_tok = f"{h}.{p}.{b64url(proc.stdout)}"
          req = urllib.request.Request(
              "https://api.github.com/app/installations",
              headers={"Authorization": f"Bearer {jwt_tok}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as resp:
              installs = json.loads(resp.read().decode())
          inst_id = next(
              (str(i["id"]) for i in installs if i.get("account", {}).get("login", "").lower() == owner.lower()),
              str(installs[0]["id"]) if installs else "",
          )
          req2 = urllib.request.Request(
              f"https://api.github.com/app/installations/{inst_id}/access_tokens",
              method="POST",
              headers={"Authorization": f"Bearer {jwt_tok}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req2) as resp2:
              print(json.loads(resp2.read().decode())["token"])
          PY
            )"
            echo "::add-mask::${TOKEN}"
            echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"
          elif [ -n "${GITOPS_TOKEN}" ]; then
            echo "token=${GITOPS_TOKEN}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither GITOPS_APP_ID/GITOPS_APP_PRIVATE_KEY nor PLATFORM_GITOPS_TOKEN is configured."
            exit 1
          fi

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: ${{ steps.descriptor.outputs.gitops_repository }}
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.gitops_token.outputs.token }}
          path: gitops

      - name: Restore exact image patch
        id: restore
        working-directory: gitops
        shell: bash
        env:
          REVISION: ${{ inputs.revision }}
          TARGET_PATH: ${{ steps.target.outputs.path }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          APPLICATION: ${{ steps.descriptor.outputs.application }}
          BASE_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git cat-file -e "${REVISION}^{commit}"
          git cat-file -e "${REVISION}:${TARGET_PATH}/images.yaml"
          git config user.name "platform-delivery[bot]"
          git config user.email "platform-delivery[bot]@users.noreply.github.com"
          git checkout "$REVISION" -- "$TARGET_PATH/images.yaml"
          git diff --check
          if git diff --cached --quiet; then
            echo "Requested revision is already active"
            exit 0
          fi
          git commit -m "revert(${APPLICATION}): restore ${TARGET_ENVIRONMENT} images from ${REVISION:0:12}"
          if [[ "$TARGET_ENVIRONMENT" == stg ]]; then
            git pull --rebase origin "$BASE_BRANCH"
            git push origin "HEAD:$BASE_BRANCH"
          else
            branch="rollback/${APPLICATION}/${REVISION}"
            git switch -c "$branch"
            git push origin "$branch"
            printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Open production rollback pull request
        if: inputs.environment == 'prod' && steps.restore.outputs.branch != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPOSITORY: ${{ steps.descriptor.outputs.gitops_repository }}
          HEAD_BRANCH: ${{ steps.restore.outputs.branch }}
          BASE_BRANCH: ${{ steps.descriptor.outputs.gitops_base_branch }}
          APPLICATION: ${{ steps.descriptor.outputs.application }}
          REVISION: ${{ inputs.revision }}
        with:
          github-token: ${{ steps.gitops_token.outputs.token }}
          script: |
            const [owner, repo] = process.env.REPOSITORY.split('/');
            const head = process.env.HEAD_BRANCH;
            const existing = await github.rest.pulls.list({ owner, repo, head: `${owner}:${head}`, state: 'open' });
            if (existing.data.length) return;
            await github.rest.pulls.create({
              owner, repo, head, base: process.env.BASE_BRANCH,
              title: `revert(${process.env.APPLICATION}): restore production images`,
              body: `Restores production image references from GitOps revision ${process.env.REVISION}.`,
            });
