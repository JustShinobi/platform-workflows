name: 🐳 Build and Push Container Image

on:
  workflow_call:
    inputs:
      IMAGE_NAME:
        description: Target image name (e.g. my-app)
        required: true
        type: string
      DOCKERFILE_PATH:
        description: Path to Dockerfile
        required: false
        type: string
        default: 'Dockerfile'
      REGISTRY_URL:
        description: Target Container Registry URL (e.g., zot.lan.kyo.ninja or ghcr.io)
        required: false
        type: string
        default: 'zot.lan.kyo.ninja'
      IMAGE_TAG:
        description: Additional tag for the image (defaults to git commit sha + latest)
        required: false
        type: string
        default: 'latest'
      RUNS_ON:
        description: Runner type
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      REGISTRY_USERNAME:
        description: Registry login username
        required: false
      REGISTRY_PASSWORD:
        description: Registry login password
        required: false

jobs:
  build-and-push-container:
    name: Build & Push Container Image
    runs-on: ${{ inputs.RUNS_ON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        if: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.REGISTRY_URL }}/${{ inputs.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ inputs.IMAGE_TAG }}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
