name: Reusable application release

on:
  workflow_call:
    inputs:
      descriptor:
        description: Repository-relative application descriptor
        required: false
        default: .ci/application.yaml
        type: string
      executor:
        description: Trusted build executor (arc or jit)
        required: false
        default: arc
        type: string
      skip_verify:
        description: Skip verification step
        required: false
        default: false
        type: boolean
    secrets:
      PLATFORM_GITOPS_TOKEN:
        required: true
      ARGOCD_SERVER:
        required: true
      ARGOCD_AUTH_TOKEN:
        required: true

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate trusted release
    if: github.event_name != 'pull_request'
    runs-on: arc-k3s
    timeout-minutes: 10
    outputs:
      application: ${{ steps.descriptor.outputs.application }}
      matrix: ${{ steps.descriptor.outputs.matrix }}
      runner: ${{ steps.executor.outputs.runner }}
      gitops_repository: ${{ steps.descriptor.outputs.gitops_repository }}
      gitops_repository_name: ${{ steps.descriptor.outputs.gitops_repository_name }}
      gitops_base_branch: ${{ steps.descriptor.outputs.gitops_base_branch }}
      gitops_staging_branch: ${{ steps.descriptor.outputs.gitops_staging_branch }}
      gitops_production_branch: ${{ steps.descriptor.outputs.gitops_production_branch }}
      gitops_staging_path: ${{ steps.descriptor.outputs.gitops_staging_path }}
      gitops_production_path: ${{ steps.descriptor.outputs.gitops_production_path }}
      gitops_staging_application: ${{ steps.descriptor.outputs.gitops_staging_application }}
      image_promotion: ${{ steps.descriptor.outputs.gitops_image_promotion }}
      promotion_mode: ${{ steps.descriptor.outputs.gitops_promotion_mode }}
      t14_enabled: ${{ steps.descriptor.outputs.t14_enabled }}
      t14_builder_key_id: ${{ steps.descriptor.outputs.t14_builder_key_id }}
      t14_builder_targets: ${{ steps.descriptor.outputs.t14_builder_targets }}
      t14_gitops_path: ${{ steps.descriptor.outputs.t14_gitops_path }}
      t14_gitops_application: ${{ steps.descriptor.outputs.t14_gitops_application }}
      t14_image_component: ${{ steps.descriptor.outputs.t14_image_component }}
      t14_shared_components: ${{ steps.descriptor.outputs.t14_shared_components }}
      t14_baseline_source_sha: ${{ steps.descriptor.outputs.t14_baseline_source_sha }}
    steps:
      - name: Check out application
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Validate delivery contract
        id: descriptor
        uses: JustShinobi/platform-workflows/.github/actions/descriptor@25737ffd3db33a4492eba241cddb3c1893ff526a
        with:
          descriptor: ${{ inputs.descriptor }}

      - name: Select bounded executor labels
        id: executor
        shell: bash
        env:
          EXECUTOR: ${{ inputs.executor }}
        run: |
          set -euo pipefail
          case "$EXECUTOR" in
            arc) printf 'runner=["arc-k3s"]\n' >> "$GITHUB_OUTPUT" ;;
            t14) printf 'runner=["arc-k3s-ninjasre-t14"]\n' >> "$GITHUB_OUTPUT" ;;
            jit) printf 'runner=["self-hosted","proxmox-lxc","crossbuild"]\n' >> "$GITHUB_OUTPUT" ;;
            *) echo "executor must be arc, t14, or jit" >&2; exit 2 ;;
          esac

      - name: Block T14 until a separate historical baseline build is available
        if: steps.descriptor.outputs.t14_enabled == 'true'
        shell: bash
        env:
          BASELINE_SOURCE_SHA: ${{ steps.descriptor.outputs.t14_baseline_source_sha }}
        run: |
          set -euo pipefail
          echo "T14 release is blocked: baseline $BASELINE_SOURCE_SHA must be built and attested separately from the proposed source before promotion." >&2
          exit 2

  verify:
    name: Verify trusted source
    needs: prepare
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Check if commit was already verified on PR
        id: check_pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FORCE_SKIP: ${{ inputs.skip_verify }}
        with:
          script: |
            if (process.env.FORCE_SKIP === 'true') {
              console.log('Explicit skip_verify requested. Skipping verify.');
              core.setOutput('skip', 'true');
              return;
            }
            try {
              const checks = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
              });
              const verifyRuns = checks.data.check_runs.filter(r => 
                r.name.toLowerCase().includes('verify') || 
                r.name.toLowerCase().includes('lint') ||
                r.name.toLowerCase().includes('typecheck') ||
                r.name.toLowerCase().includes('test')
              );
              const allPassed = verifyRuns.length > 0 && verifyRuns.every(r => r.conclusion === 'success');
              if (allPassed) {
                console.log(`Commit ${context.sha} already verified in PR with ${verifyRuns.length} green checks. Skipping redundant verify.`);
                core.setOutput('skip', 'true');
                return;
              }
              console.log(`Commit ${context.sha} needs verification (passed checks: ${verifyRuns.length}).`);
            } catch (err) {
              console.log(`Could not check commit status (${err.message}). Proceeding with verification.`);
            }
            core.setOutput('skip', 'false');
      - name: Detect the Node package manager
        id: node_cache
        if: steps.check_pr.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "kind=pnpm" >> "$GITHUB_OUTPUT"
            echo "path=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "kind=yarn" >> "$GITHUB_OUTPUT"
            echo "path=yarn.lock" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "kind=npm" >> "$GITHUB_OUTPUT"
            if [ -f package-lock.json ]; then
              echo "path=package-lock.json" >> "$GITHUB_OUTPUT"
            else
              echo "path=npm-shrinkwrap.json" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "kind=" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js runtime
        if: steps.check_pr.outputs.skip != 'true'
        uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85 # v7.0.0
        with:
          node-version: '24'
          # pnpm is enabled after Node is installed; resolving its cache here
          # would fail before Corepack can create the pnpm shim.
          cache: ${{ steps.node_cache.outputs.kind == 'npm' && 'npm' || steps.node_cache.outputs.kind == 'yarn' && 'yarn' || '' }}
          cache-dependency-path: ${{ steps.node_cache.outputs.path }}
      - name: Run repository verification contract
        if: steps.check_pr.outputs.skip != 'true'
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          set -euo pipefail
          test -x scripts/ci/verify
          scripts/ci/verify

  build:
    name: Build ${{ matrix.name }}
    needs: [prepare, verify]
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Verify mounted Zot credentials
        shell: bash
        run: |
          set -euo pipefail
          test -s /run/secrets/zot/config.json
          docker_config="$RUNNER_TEMP/.docker"
          install -d -m 0700 "$docker_config"
          install -m 0600 /run/secrets/zot/config.json "$docker_config/config.json"
          grep --fixed-strings --quiet 'registry.lan.kyo.ninja' "$docker_config/config.json"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare T14 OCI output directory
        if: needs.prepare.outputs.t14_enabled == 'true' && matrix.name == needs.prepare.outputs.t14_image_component
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          rm -rf ".ci/t14/oci-${{ matrix.name }}"
          mkdir -p ".ci/t14"

      - name: Build and publish immutable candidate
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          # The signed T14 builder envelope hashes the exact OCI layout below.
          # BuildKit's default provenance/SBOM exporter wraps the registry
          # digest in an attestation index but does not copy that index blob to
          # the local OCI exporter. Keep those two outputs separate: Anchore
          # emits the SBOM artifact below, while this build emits the exact
          # single-platform image manifest consumed by the DSSE producer.
          provenance: false
          sbom: false
          tags: ${{ matrix.image }}:sha-${{ github.sha }}-${{ matrix.name }}
          outputs: ${{ needs.prepare.outputs.t14_enabled == 'true' && matrix.name == needs.prepare.outputs.t14_image_component && format('type=oci,dest=.ci/t14/oci-{0},tar=false', matrix.name) || '' }}
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache-${{ matrix.name }}
          cache-to: type=registry,ref=${{ matrix.image }}:buildcache-${{ matrix.name }},mode=max

      - name: Set up pinned Python for T14 proof
        if: needs.prepare.outputs.t14_enabled == 'true' && matrix.name == needs.prepare.outputs.t14_image_component
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # v5.4.0
        with:
          python-version: '3.12'

      - name: Set up uv for T14 proof
        if: needs.prepare.outputs.t14_enabled == 'true' && matrix.name == needs.prepare.outputs.t14_image_component
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Produce T14 builder proofs from immutable CI inputs
        if: needs.prepare.outputs.t14_enabled == 'true' && matrix.name == needs.prepare.outputs.t14_image_component
        shell: bash
        env:
          T14_TARGETS: ${{ needs.prepare.outputs.t14_builder_targets }}
          T14_KEY_ID: ${{ needs.prepare.outputs.t14_builder_key_id }}
          T14_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          T14_KEY_PATH: /run/secrets/t14/builder-key/private-key
        run: |
          set -euo pipefail
          test -s "$T14_KEY_PATH"
          test -n "$T14_KEY_ID"
          test -n "$T14_IMAGE_DIGEST"
          targets_text="${T14_TARGETS//,/ }"
          read -r -a targets <<< "$targets_text"
          test "${#targets[@]}" -eq 6
          proposed_count=0
          for target in "${targets[@]}"; do
            if [ "$target" = baseline ]; then
              continue
            fi
            uv run --frozen --no-dev python tools/t14_builder_attestation.py \
              --repository-root . \
              --oci-layout ".ci/t14/oci-${{ matrix.name }}" \
              --lock-file uv.lock \
              --target-name "$target" \
              --image-digest "$T14_IMAGE_DIGEST" \
              --key-id "$T14_KEY_ID" \
              --private-key-file "$T14_KEY_PATH" \
              --output ".ci/t14/builder-proposed-${target}.dsse"
            proposed_count=$((proposed_count + 1))
          done
          test "$proposed_count" -eq 5
          test "$(find .ci/t14 -maxdepth 1 -name 'builder-proposed-*.dsse' -type f | wc -l)" -eq 5

      - name: Upload T14 builder proofs
        if: needs.prepare.outputs.t14_enabled == 'true' && matrix.name == needs.prepare.outputs.t14_image_component
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t14-builder-proof-${{ matrix.name }}
          path: .ci/t14/builder-*.dsse
          retention-days: 30
          if-no-files-found: error

      # The Syft installer is fetched from GitHub at runtime. A transient 503
      # from that endpoint used to fail the whole release after the image had
      # already been published. Keep the evidence mandatory, but give the
      # download two additional attempts before failing the job.
      - name: Generate SPDX SBOM (attempt 1)
        id: sbom_attempt_1
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Wait before SPDX SBOM retry
        if: steps.sbom_attempt_1.outcome == 'failure'
        shell: bash
        run: sleep 15

      - name: Generate SPDX SBOM (attempt 2)
        id: sbom_attempt_2
        if: steps.sbom_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Wait before final SPDX SBOM retry
        if: steps.sbom_attempt_2.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Generate SPDX SBOM (attempt 3)
        id: sbom_attempt_3
        if: steps.sbom_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SPDX SBOM evidence
        if: always()
        shell: bash
        run: test -s "sbom-${{ matrix.name }}.spdx.json"

      - name: Scan published candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Record immutable release fragment
        shell: bash
        env:
          COMPONENT: ${{ matrix.name }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          WORKLOAD: ${{ matrix.workload }}
          CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          value = {key.lower(): os.environ[key] for key in ("COMPONENT", "IMAGE", "DIGEST", "WORKLOAD", "CONTAINER")}
          with open(f"release-{value['component']}.json", "w", encoding="utf-8") as output:
              json.dump(value, output, sort_keys=True)
          PY

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.name }}
          path: |
            release-${{ matrix.name }}.json
            sbom-${{ matrix.name }}.spdx.json
          retention-days: 30
          if-no-files-found: error

  promote-staging:
    name: Promote immutable digests to staging
    if: needs.prepare.outputs.promotion_mode != 'production-only'
    needs: [prepare, build]
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 20
    steps:
      - name: Check out validated GitOps source branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.gitops_repository }}
          ref: ${{ needs.prepare.outputs.gitops_base_branch }}
          token: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
          path: gitops

      - name: Download immutable release evidence
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Download T14 builder proofs
        if: needs.prepare.outputs.t14_enabled == 'true'
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          pattern: t14-builder-proof-*
          path: t14-proofs
          merge-multiple: true

      - name: Download T14 historical baseline release
        if: needs.prepare.outputs.t14_enabled == 'true'
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          name: t14-baseline-release
          path: t14-baseline

      - name: Update staging image patches
        uses: JustShinobi/platform-workflows/.github/actions/update-gitops-images@v1
        with:
          images-file: gitops/${{ needs.prepare.outputs.gitops_staging_path }}/${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'values-stg.yaml' || 'images.yaml' }}
          release-directory: release
          mode: ${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'chart-values' || 'kustomize' }}

      - name: Update T14 image patches
        if: needs.prepare.outputs.t14_enabled == 'true'
        uses: JustShinobi/platform-workflows/.github/actions/update-gitops-images@v1
        with:
          images-file: gitops/${{ needs.prepare.outputs.t14_gitops_path }}/images.yaml
          release-directory: release
          t14-targets: ${{ needs.prepare.outputs.t14_builder_targets }}
          t14-component: ${{ needs.prepare.outputs.t14_image_component }}
          t14-shared-components: ${{ needs.prepare.outputs.t14_shared_components }}
          t14-baseline-release-file: t14-baseline/release-t14-baseline-app.json
          t14-proof-directory: t14-proofs
          t14-builder-key-id: ${{ needs.prepare.outputs.t14_builder_key_id }}
          t14-baseline-source-sha: ${{ needs.prepare.outputs.t14_baseline_source_sha }}
          t14-proposed-source-sha: ${{ github.sha }}
          t14-builder-public-key-file: /run/secrets/t14/builder-key/public-key

      - name: Stage T14 builder proofs with the image promotion
        if: needs.prepare.outputs.t14_enabled == 'true'
        shell: bash
        env:
          T14_PATH: ${{ needs.prepare.outputs.t14_gitops_path }}
        run: |
          set -euo pipefail
          test "$(find t14-proofs -maxdepth 1 -name '*.dsse' -type f | wc -l)" -eq 6
          proof_dir="gitops/$T14_PATH/proofs"
          install -d -m 0755 "$proof_dir"
          for proof in t14-proofs/*.dsse; do
            install -m 0644 "$proof" "$proof_dir/$(basename "$proof")"
          done

      - name: Commit staging promotion
        id: commit
        working-directory: gitops
        shell: bash
        env:
          APPLICATION: ${{ needs.prepare.outputs.application }}
          SOURCE_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ needs.prepare.outputs.gitops_base_branch }}
          T14_ENABLED: ${{ needs.prepare.outputs.t14_enabled }}
          T14_PATH: ${{ needs.prepare.outputs.t14_gitops_path }}
        run: |
          set -euo pipefail
          git config user.name "platform-delivery[bot]"
          git config user.email "platform-delivery[bot]@users.noreply.github.com"
          git add -- "${{ needs.prepare.outputs.gitops_staging_path }}/${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'values-stg.yaml' || 'images.yaml' }}"
          if [ "$T14_ENABLED" = true ]; then
            git add -- "$T14_PATH/images.yaml" "$T14_PATH/proofs"
          fi
          if git diff --cached --quiet; then
            echo "No staging image change required"
          else
            git commit -m "chore(${APPLICATION}): promote ${SOURCE_SHA:0:12} to staging"
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for Argo CD staging health
        shell: bash
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          APPLICATION: ${{ needs.prepare.outputs.gitops_staging_application }}
          REVISION: ${{ steps.commit.outputs.revision }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
              "$ARGOCD_SERVER/api/v1/applications/$APPLICATION")"
            health="$(jq -r '.status.health.status // ""' <<<"$status")"
            sync="$(jq -r '.status.sync.status // ""' <<<"$status")"
            revision="$(jq -r '.status.sync.revision // ""' <<<"$status")"
            if [[ "$health" == Healthy && "$sync" == Synced && "$revision" == "$REVISION" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Argo CD did not reconcile $APPLICATION to $REVISION in 10 minutes" >&2
          exit 1

      - name: Wait for Argo CD T14 health
        if: needs.prepare.outputs.t14_enabled == 'true'
        shell: bash
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          APPLICATION: ${{ needs.prepare.outputs.t14_gitops_application }}
          REVISION: ${{ steps.commit.outputs.revision }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
              "$ARGOCD_SERVER/api/v1/applications/$APPLICATION")"
            health="$(jq -r '.status.health.status // ""' <<<"$status")"
            sync="$(jq -r '.status.sync.status // ""' <<<"$status")"
            revision="$(jq -r '.status.sync.revision // ""' <<<"$status")"
            if [[ "$health" == Healthy && "$sync" == Synced && "$revision" == "$REVISION" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Argo CD did not reconcile $APPLICATION to $REVISION in 10 minutes" >&2
          exit 1

      - name: Check out application for smoke test
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          path: application

      - name: Detect a Node dependency cache for the smoke test
        id: smoke_node_cache
        shell: bash
        run: |
          set -euo pipefail
          # The same failure as the verification job above, one checkout deeper.
          # `actions/setup-node` fails outright when `cache` is set and the
          # dependency path matches nothing, so an application whose Node
          # workspace lives in a subdirectory — or which uses a package manager
          # other than npm there — cannot be smoke-tested at all.
          #
          # Worse here than there, because by this point the promotion has
          # already happened and Argo CD has already reported the deployment
          # healthy. The run goes red for a cache it never needed, after the
          # thing it was verifying succeeded.
          for lockfile in pnpm-lock.yaml yarn.lock package-lock.json npm-shrinkwrap.json; do
            if [ -f "application/$lockfile" ]; then
              case "$lockfile" in
                pnpm-lock.yaml) echo "kind=pnpm" >> "$GITHUB_OUTPUT" ;;
                yarn.lock) echo "kind=yarn" >> "$GITHUB_OUTPUT" ;;
                *) echo "kind=npm" >> "$GITHUB_OUTPUT" ;;
              esac
              echo "path=application/$lockfile" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "kind=" >> "$GITHUB_OUTPUT"
          echo "path=" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js runtime
        uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85 # v7.0.0
        with:
          node-version: '24'
          cache: ${{ steps.smoke_node_cache.outputs.kind == 'npm' && 'npm' || steps.smoke_node_cache.outputs.kind == 'yarn' && 'yarn' || '' }}
          cache-dependency-path: ${{ steps.smoke_node_cache.outputs.path }}

      - name: Run fixed staging smoke contract
        working-directory: application
        shell: bash
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          test -x scripts/ci/smoke-stg
          scripts/ci/smoke-stg

  propose-production:
    name: Open production promotion PR
    needs: [prepare, promote-staging]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.promote-staging.result == 'success' || needs.promote-staging.result == 'skipped')
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.gitops_repository }}
          ref: ${{ needs.prepare.outputs.gitops_base_branch }}
          token: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
          path: gitops

      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Prepare production promotion branch
        id: production
        working-directory: gitops
        shell: bash
        env:
          APPLICATION: ${{ needs.prepare.outputs.application }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="promote/${APPLICATION}/${SOURCE_SHA}"
          git config user.name "platform-delivery[bot]"
          git config user.email "platform-delivery[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git switch -C "$branch" "origin/$branch"
            echo "Reusing existing production promotion branch $branch"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "Could not determine whether production promotion branch $branch exists" >&2
              exit "$status"
            fi
            git switch -c "$branch"
          fi
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"

      - name: Update production image patches
        uses: JustShinobi/platform-workflows/.github/actions/update-gitops-images@v1
        with:
          images-file: gitops/${{ needs.prepare.outputs.gitops_production_path }}/${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'values-prd.yaml' || 'images.yaml' }}
          release-directory: release
          mode: ${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'chart-values' || 'kustomize' }}

      - name: Commit production promotion
        working-directory: gitops
        shell: bash
        env:
          APPLICATION: ${{ needs.prepare.outputs.application }}
          SOURCE_SHA: ${{ github.sha }}
          BRANCH: ${{ steps.production.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "platform-delivery[bot]"
          git config user.email "platform-delivery[bot]@users.noreply.github.com"
          git add -- "${{ needs.prepare.outputs.gitops_production_path }}/${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'values-prd.yaml' || 'images.yaml' }}"
          if git diff --cached --quiet; then
            echo "Production already references these digests"
            exit 0
          fi
          git commit -m "chore(${APPLICATION}): promote ${SOURCE_SHA:0:12} to production"
          git push origin "$BRANCH"

      - name: Open production pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPOSITORY: ${{ needs.prepare.outputs.gitops_repository }}
          HEAD_BRANCH: ${{ steps.production.outputs.branch }}
          BASE_BRANCH: ${{ needs.prepare.outputs.gitops_base_branch }}
          APPLICATION: ${{ needs.prepare.outputs.application }}
          SOURCE_SHA: ${{ github.sha }}
        with:
          github-token: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
          script: |
            const [owner, repo] = process.env.REPOSITORY.split('/');
            const head = process.env.HEAD_BRANCH;
            if (!head) return;
            const existing = await github.rest.pulls.list({ owner, repo, head: `${owner}:${head}`, state: 'open' });
            if (existing.data.length) return;
            const validation = process.env.PROMOTION_MODE === 'production-only'
              ? 'validated by the repository verification checks'
              : 'validated in staging';
            await github.rest.pulls.create({
              owner, repo, head, base: process.env.BASE_BRANCH,
              title: `chore(${process.env.APPLICATION}): promote ${process.env.SOURCE_SHA.slice(0, 12)} to production`,
              body: `Promotes the exact image digests ${validation}.\n\nSource: ${context.repo.owner}/${context.repo.repo}@${process.env.SOURCE_SHA}\nWorkflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
