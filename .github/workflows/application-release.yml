name: Reusable application release

on:
  workflow_call:
    inputs:
      descriptor:
        description: Repository-relative application descriptor
        required: false
        default: .ci/application.yaml
        type: string
      source_revision:
        description: Full application commit SHA to build; defaults to the caller commit
        required: false
        default: ''
        type: string
      executor:
        description: Trusted build executor (arc or jit)
        required: false
        default: arc
        type: string
      t14_build_only:
        description: Build unsigned T14 proposed evidence for separate host verification
        required: false
        default: false
        type: boolean
      skip_verify:
        description: Skip verification step
        required: false
        default: false
        type: boolean
      skip_security_scan:
        description: Skip inline SBOM generation and Trivy scan
        required: false
        default: false
        type: boolean
      upload_auxiliary_artifacts:
        description: Upload optional Docker build records
        required: false
        default: true
        type: boolean
    secrets:
      PLATFORM_GITOPS_TOKEN:
        required: false
      GITOPS_APP_ID:
        required: false
      GITOPS_APP_PRIVATE_KEY:
        required: false
      ARGOCD_SERVER:
        required: true
      ARGOCD_AUTH_TOKEN:
        required: true
      T14_BASELINE_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate trusted release
    if: github.event_name != 'pull_request'
    runs-on: arc-k3s-light
    timeout-minutes: 10
    outputs:
      application: ${{ steps.descriptor.outputs.application }}
      matrix: ${{ steps.descriptor.outputs.matrix }}
      runner: ${{ steps.executor.outputs.runner }}
      gitops_repository: ${{ steps.descriptor.outputs.gitops_repository }}
      gitops_repository_name: ${{ steps.descriptor.outputs.gitops_repository_name }}
      gitops_base_branch: ${{ steps.descriptor.outputs.gitops_base_branch }}
      gitops_staging_branch: ${{ steps.descriptor.outputs.gitops_staging_branch }}
      gitops_production_branch: ${{ steps.descriptor.outputs.gitops_production_branch }}
      gitops_staging_path: ${{ steps.descriptor.outputs.gitops_staging_path }}
      gitops_production_path: ${{ steps.descriptor.outputs.gitops_production_path }}
      gitops_staging_application: ${{ steps.descriptor.outputs.gitops_staging_application }}
      gitops_production_application: ${{ steps.descriptor.outputs.gitops_production_application }}
      image_promotion: ${{ steps.descriptor.outputs.gitops_image_promotion }}
      promotion_mode: ${{ steps.descriptor.outputs.gitops_promotion_mode }}
      explicit_source_revision: ${{ inputs.source_revision != '' && 'true' || 'false' }}
      t14_enabled: ${{ steps.descriptor.outputs.t14_enabled }}
      t14_builder_key_id: ${{ steps.descriptor.outputs.t14_builder_key_id }}
      t14_builder_targets: ${{ steps.descriptor.outputs.t14_builder_targets }}
      t14_gitops_path: ${{ steps.descriptor.outputs.t14_gitops_path }}
      t14_gitops_application: ${{ steps.descriptor.outputs.t14_gitops_application }}
      t14_image_component: ${{ steps.descriptor.outputs.t14_image_component }}
      t14_shared_components: ${{ steps.descriptor.outputs.t14_shared_components }}
      t14_baseline_source_sha: ${{ steps.descriptor.outputs.t14_baseline_source_sha }}
      t14_baseline_workflow_sha: ${{ steps.descriptor.outputs.t14_baseline_workflow_sha }}
      t14_baseline_repository: ${{ steps.descriptor.outputs.t14_baseline_repository }}
      t14_baseline_run_id: ${{ steps.descriptor.outputs.t14_baseline_run_id }}
      t14_baseline_artifact_name: ${{ steps.descriptor.outputs.t14_baseline_artifact_name }}
      t14_only_components: ${{ steps.descriptor.outputs.t14_only_components }}
      t14_build_only: ${{ inputs.t14_build_only }}
      source_revision: ${{ steps.source_revision.outputs.sha }}
    steps:
      - name: Validate source revision input
        shell: bash
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          if [ -n "$SOURCE_REVISION" ] && [[ ! "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_revision must be empty or a full 40-character lowercase commit SHA" >&2
            exit 2
          fi

      - name: Check out application
        id: application
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          persist-credentials: false

      - name: Record checked-out source revision
        id: source_revision
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_revision || github.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$EXPECTED_SOURCE_SHA" ]; then
            echo "checked-out source does not match the requested full commit SHA" >&2
            exit 2
          fi
          printf 'sha=%s\n' "$checked_out_sha" >> "$GITHUB_OUTPUT"

      - name: Validate delivery contract
        id: descriptor
        uses: JustShinobi/platform-workflows/.github/actions/descriptor@0d18d31f2b76cdba12ce469784c60ff2448e1f6d
        with:
          descriptor: ${{ inputs.descriptor }}

      - name: Require T14 build-only mode
        if: steps.descriptor.outputs.t14_enabled == 'true'
        shell: bash
        env:
          T14_BUILD_ONLY: ${{ inputs.t14_build_only }}
        run: |
          set -euo pipefail
          if [ "$T14_BUILD_ONLY" != true ]; then
            echo "T14 descriptors require t14_build_only=true until host verification and promotion are separate" >&2
            exit 2
          fi

      - name: Require app component for build-only evidence
        if: inputs.t14_build_only == true
        shell: bash
        env:
          MATRIX: ${{ steps.descriptor.outputs.matrix }}
        run: |
          set -euo pipefail
          if ! jq -e 'any(.include[]?; .name == "app")' <<<"$MATRIX" >/dev/null; then
            echo "t14_build_only requires an app component in the validated build matrix" >&2
            exit 2
          fi

      - name: Select bounded executor labels
        id: executor
        shell: bash
        env:
          EXECUTOR: ${{ inputs.executor }}
        run: |
          set -euo pipefail
          case "$EXECUTOR" in
            arc) printf 'runner=["arc-k3s-heavy"]\n' >> "$GITHUB_OUTPUT" ;;
            arc-medium) printf 'runner=["arc-k3s-medium"]\n' >> "$GITHUB_OUTPUT" ;;
            arc-light) printf 'runner=["arc-k3s-light"]\n' >> "$GITHUB_OUTPUT" ;;
            t14) printf 'runner=["arc-k3s-ninjasre-t14"]\n' >> "$GITHUB_OUTPUT" ;;
            *) echo "executor must be arc, arc-medium, arc-light, or t14" >&2; exit 2 ;;
          esac

  verify:
    name: Verify trusted source
    needs: prepare
    if: inputs.skip_verify != true
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.prepare.outputs.source_revision }}
          persist-credentials: false
      - name: Check if commit was already verified on PR
        id: check_pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FORCE_SKIP: ${{ inputs.skip_verify }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_revision }}
        with:
          script: |
            if (process.env.FORCE_SKIP === 'true') {
              console.log('Explicit skip_verify requested. Skipping verify.');
              core.setOutput('skip', 'true');
              return;
            }
            try {
              const checks = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: process.env.SOURCE_SHA,
              });
              const verifyRuns = checks.data.check_runs.filter(r => 
                r.name.toLowerCase().includes('verify') || 
                r.name.toLowerCase().includes('lint') ||
                r.name.toLowerCase().includes('typecheck') ||
                r.name.toLowerCase().includes('test')
              );
              const allPassed = verifyRuns.length > 0 && verifyRuns.every(r => r.conclusion === 'success');
              if (allPassed) {
                console.log(`Commit ${process.env.SOURCE_SHA} already verified in PR with ${verifyRuns.length} green checks. Skipping redundant verify.`);
                core.setOutput('skip', 'true');
                return;
              }
              console.log(`Commit ${process.env.SOURCE_SHA} needs verification (passed checks: ${verifyRuns.length}).`);
            } catch (err) {
              console.log(`Could not check commit status (${err.message}). Proceeding with verification.`);
            }
            core.setOutput('skip', 'false');
      - name: Detect the Node package manager
        id: node_cache
        if: steps.check_pr.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            echo "kind=pnpm" >> "$GITHUB_OUTPUT"
            echo "path=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "kind=yarn" >> "$GITHUB_OUTPUT"
            echo "path=yarn.lock" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "kind=npm" >> "$GITHUB_OUTPUT"
            if [ -f package-lock.json ]; then
              echo "path=package-lock.json" >> "$GITHUB_OUTPUT"
            else
              echo "path=npm-shrinkwrap.json" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "kind=" >> "$GITHUB_OUTPUT"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js runtime
        if: steps.check_pr.outputs.skip != 'true'
        uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85 # v7.0.0
        with:
          node-version: '24'
          # pnpm is enabled after Node is installed; resolving its cache here
          # would fail before Corepack can create the pnpm shim.
          cache: ${{ steps.node_cache.outputs.kind == 'npm' && 'npm' || steps.node_cache.outputs.kind == 'yarn' && 'yarn' || '' }}
          cache-dependency-path: ${{ steps.node_cache.outputs.path }}
      - name: Run repository verification contract
        if: steps.check_pr.outputs.skip != 'true'
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=2560"
        run: |
          set -euo pipefail
          test -x scripts/ci/verify
          scripts/ci/verify

  build:
    name: Build ${{ matrix.name }}
    needs: [prepare, verify]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ${{ fromJSON(needs.prepare.outputs.runner) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_revision }}
          persist-credentials: false

      - name: Verify mounted Zot credentials
        shell: bash
        run: |
          set -euo pipefail
          test -s /run/secrets/zot/config.json
          docker_config="$RUNNER_TEMP/.docker"
          install -d -m 0700 "$docker_config"
          install -m 0600 /run/secrets/zot/config.json "$docker_config/config.json"
          grep --fixed-strings --quiet 'registry.lan.kyo.ninja' "$docker_config/config.json"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: |
            image=registry.lan.kyo.ninja/moby/buildkit:buildx-stable-1

      - name: Prepare T14 OCI output directory
        if: needs.prepare.outputs.t14_build_only == 'true' && matrix.name == 'app'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          rm -rf ".ci/t14/oci-${{ matrix.name }}"
          mkdir -p ".ci/t14"

      - name: Build and publish immutable candidate
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: ${{ inputs.upload_auxiliary_artifacts }}
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          # BuildKit's default provenance/SBOM exporter wraps the registry
          # digest in an attestation index but does not copy that index blob to
          # the local OCI exporter. Anchore emits the SBOM artifact below;
          # build-only host verification consumes this exact OCI image layout.
          provenance: false
          sbom: false
          tags: ${{ matrix.image }}:sha-${{ needs.prepare.outputs.source_revision }}-${{ matrix.name }}
          outputs: ${{ needs.prepare.outputs.t14_build_only == 'true' && matrix.name == 'app' && 'type=oci,dest=.ci/t14/oci-app,tar=false' || '' }}
          cache-from: type=registry,ref=${{ matrix.image }}:buildcache-${{ matrix.name }}
          cache-to: type=registry,ref=${{ matrix.image }}:buildcache-${{ matrix.name }},mode=max

      - name: Set up Python for T14 receipt
        if: needs.prepare.outputs.t14_build_only == 'true' && matrix.name == 'app'
        uses: actions/setup-python@8549b9f8f590ad24eab7482f36f6e1e24d34597b # v5.4.0
        with:
          python-version: '3.12'

      - name: Create unsigned T14 proposed artifact
        if: needs.prepare.outputs.t14_build_only == 'true' && matrix.name == 'app'
        shell: bash
        env:
          T14_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          T14_APPLICATION_REVISION: ${{ needs.prepare.outputs.source_revision }}
          T14_WORKFLOW_REVISION: ${{ github.workflow_sha }}
          T14_WORKFLOW_REF: ${{ github.workflow_ref }}
          T14_RUN_ID: ${{ github.run_id }}
          T14_RUN_ATTEMPT: ${{ github.run_attempt }}
          T14_OCI_LAYOUT: .ci/t14/oci-app
          T14_OCI_ARCHIVE: .ci/t14/release-t14-proposed-app.oci.tar
          T14_RECEIPT: .ci/t14/release-t14-proposed-app.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tarfile
          from pathlib import Path

          image_digest = os.environ["T14_IMAGE_DIGEST"]
          application_revision = os.environ["T14_APPLICATION_REVISION"]
          if re.fullmatch(r"sha256:[0-9a-f]{64}", image_digest) is None:
              raise SystemExit("image build did not return a valid immutable digest")
          if re.fullmatch(r"[0-9a-f]{40}", application_revision) is None:
              raise SystemExit("checked-out application revision is not a full commit SHA")
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != application_revision:
              raise SystemExit("receipt source revision differs from the checked-out application")

          layout = Path(os.environ["T14_OCI_LAYOUT"])
          archive_path = Path(os.environ["T14_OCI_ARCHIVE"])
          receipt_path = Path(os.environ["T14_RECEIPT"])
          for name in ("oci-layout", "index.json", "blobs"):
              path = layout / name
              if not path.exists() or path.is_symlink():
                  raise SystemExit(f"OCI layout is missing a safe {name} entry")
          if not (layout / "oci-layout").is_file() or not (layout / "index.json").is_file():
              raise SystemExit("OCI layout metadata entries must be regular files")
          if not (layout / "blobs").is_dir():
              raise SystemExit("OCI layout blobs entry must be a directory")
          if any(path.is_symlink() for path in layout.rglob("*")):
              raise SystemExit("OCI layout must not contain symbolic links")

          archive_path.parent.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive_path, "w", format=tarfile.USTAR_FORMAT) as archive:
              for name in ("oci-layout", "index.json", "blobs"):
                  archive.add(layout / name, arcname=name)

          source_archive = subprocess.check_output(["git", "archive", "--format=tar", "HEAD"])
          receipt = {
              "schema_version": 3,
              "target_name": "proposed",
              "workflow_revision": os.environ["T14_WORKFLOW_REVISION"],
              "workflow_ref": os.environ["T14_WORKFLOW_REF"],
              "workflow_run_id": os.environ["T14_RUN_ID"],
              "run_attempt": int(os.environ["T14_RUN_ATTEMPT"]),
              "application_revision": application_revision,
              "image_digest": image_digest,
              "oci_archive_sha256": "sha256:" + hashlib.sha256(archive_path.read_bytes()).hexdigest(),
              "source_sha256": hashlib.sha256(source_archive).hexdigest(),
              "lock_sha256": hashlib.sha256(Path("uv.lock").read_bytes()).hexdigest(),
              "proof_status": "unsigned-awaiting-host-attestor",
          }
          receipt_path.write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload unsigned T14 proposed artifact
        if: needs.prepare.outputs.t14_build_only == 'true' && matrix.name == 'app'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: t14-proposed-release-app
          path: |
            .ci/t14/release-t14-proposed-app.oci.tar
            .ci/t14/release-t14-proposed-app.json
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true

      - name: Report deferred T14 host promotion
        if: needs.prepare.outputs.t14_build_only == 'true' && matrix.name == 'app'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### T14 host verification pending"
            echo
            echo 'The unsigned proposed artifact was uploaded as t14-proposed-release-app.'
            echo "Staging and production promotion are deferred until host verification succeeds and a separate promotion workflow completes."
            echo "The host derives five proposed target envelopes from this one verified build."
          } >> "$GITHUB_STEP_SUMMARY"

      # The Syft installer is fetched from GitHub at runtime. A transient 503
      # from that endpoint used to fail the whole release after the image had
      # already been published. Keep the evidence mandatory, but give the
      # download two additional attempts before failing the job.
      - name: Generate SPDX SBOM (attempt 1)
        id: sbom_attempt_1
        if: inputs.skip_security_scan != true
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Wait before SPDX SBOM retry
        if: inputs.skip_security_scan != true && steps.sbom_attempt_1.outcome == 'failure'
        shell: bash
        run: sleep 15

      - name: Generate SPDX SBOM (attempt 2)
        id: sbom_attempt_2
        if: inputs.skip_security_scan != true && steps.sbom_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Wait before final SPDX SBOM retry
        if: inputs.skip_security_scan != true && steps.sbom_attempt_2.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Generate SPDX SBOM (attempt 3)
        id: sbom_attempt_3
        if: inputs.skip_security_scan != true && steps.sbom_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SPDX SBOM evidence
        if: always() && inputs.skip_security_scan != true
        shell: bash
        run: test -s "sbom-${{ matrix.name }}.spdx.json"

      - name: Scan published candidate
        if: inputs.skip_security_scan != true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Record immutable release fragment
        shell: bash
        env:
          COMPONENT: ${{ matrix.name }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          WORKLOAD: ${{ matrix.workload }}
          CONTAINER: ${{ matrix.container }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          value = {key.lower(): os.environ[key] for key in ("COMPONENT", "IMAGE", "DIGEST", "WORKLOAD", "CONTAINER")}
          with open(f"release-{value['component']}.json", "w", encoding="utf-8") as output:
              json.dump(value, output, sort_keys=True)
          PY


  promote-staging:
    name: Promote immutable digests to staging
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.build.result == 'success' &&
      needs.prepare.outputs.t14_build_only != 'true' &&
      needs.prepare.outputs.promotion_mode != 'production-only'
    needs: [prepare, build]
    runs-on: ${{ needs.prepare.outputs.t14_enabled == 'true' && fromJSON(needs.prepare.outputs.runner) || fromJSON('["arc-k3s-light"]') }}
    timeout-minutes: 20
    outputs:
      t14_application_activated: ${{ steps.t14_activation.outputs.activated }}
      t14_publication_only: ${{ steps.t14_activation.outputs.publication_only }}
      superseded: ${{ steps.monotonic_guard.outputs.superseded }}
    steps:
      - name: Resolve GitOps authentication token (GitHub App or PAT fallback)
        id: gitops_token
        shell: bash
        env:
          GITOPS_TOKEN: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
          GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
          GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          GITOPS_REPO: ${{ needs.prepare.outputs.gitops_repository }}
        run: |
          set -euo pipefail
          if [ -n "${GITOPS_APP_ID}" ] && [ -n "${GITOPS_APP_PRIVATE_KEY}" ]; then
            TOKEN="$(python3 - <<'PY'
          import base64, json, os, subprocess, time, urllib.request
          def b64url(b: bytes) -> str:
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          app_id = os.environ["GITOPS_APP_ID"].strip()
          priv_key = os.environ["GITOPS_APP_PRIVATE_KEY"].strip()
          owner = os.environ.get("GITOPS_REPO", "Shhinobi/k3s-gitops-prod").split("/", 1)[0]
          now = int(time.time())
          h = b64url(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
          p = b64url(json.dumps({"iat": now - 60, "exp": now + 300, "iss": app_id}).encode())
          proc = subprocess.run(
              ["bash", "-c", 'openssl dgst -sha256 -sign <(printf "%s" "$PRIV_KEY")'],
              input=f"{h}.{p}".encode(),
              env={"PRIV_KEY": priv_key, "PATH": "/usr/bin:/bin"},
              capture_output=True,
              check=True,
          )
          jwt_tok = f"{h}.{p}.{b64url(proc.stdout)}"
          req = urllib.request.Request(
              "https://api.github.com/app/installations",
              headers={"Authorization": f"Bearer {jwt_tok}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as resp:
              installs = json.loads(resp.read().decode())
          inst_id = next(
              (str(i["id"]) for i in installs if i.get("account", {}).get("login", "").lower() == owner.lower()),
              str(installs[0]["id"]) if installs else "",
          )
          req2 = urllib.request.Request(
              f"https://api.github.com/app/installations/{inst_id}/access_tokens",
              method="POST",
              headers={"Authorization": f"Bearer {jwt_tok}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req2) as resp2:
              print(json.loads(resp2.read().decode())["token"])
          PY
            )"
            echo "::add-mask::${TOKEN}"
            echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"
          elif [ -n "${GITOPS_TOKEN}" ]; then
            echo "token=${GITOPS_TOKEN}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither GITOPS_APP_ID/GITOPS_APP_PRIVATE_KEY nor PLATFORM_GITOPS_TOKEN is configured."
            exit 1
          fi

      - name: Check out validated GitOps source branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.gitops_repository }}
          # Enabled T14 binds stagingBranch to the trunk; other releases retain baseBranch.
          ref: ${{ needs.prepare.outputs.t14_enabled == 'true' && needs.prepare.outputs.gitops_staging_branch || needs.prepare.outputs.gitops_base_branch }}
          fetch-depth: 0
          token: ${{ steps.gitops_token.outputs.token }}
          path: gitops

      - name: Guard against out-of-order staging downgrade
        id: monotonic_guard
        working-directory: gitops
        shell: bash
        env:
          T14_ENABLED: ${{ needs.prepare.outputs.t14_enabled }}
          EXPLICIT_SOURCE_REVISION: ${{ needs.prepare.outputs.explicit_source_revision }}
          APPLICATION: ${{ needs.prepare.outputs.application }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_revision }}
          SOURCE_REPO: ${{ github.repository }}
          GITOPS_REPO: ${{ needs.prepare.outputs.gitops_repository }}
          BASE_BRANCH: ${{ needs.prepare.outputs.gitops_base_branch }}
          STAGING_FILE: ${{ needs.prepare.outputs.gitops_staging_path }}/${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'values-stg.yaml' || 'images.yaml' }}
          GITOPS_TOKEN: ${{ steps.gitops_token.outputs.token }}
          APP_READ_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          if [ "$T14_ENABLED" = true ] || [ "$EXPLICIT_SOURCE_REVISION" = true ]; then
            printf 'superseded=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.parse, urllib.request

          app = os.environ["APPLICATION"].strip()
          source_sha = os.environ["SOURCE_SHA"].strip()
          source_repo = os.environ["SOURCE_REPO"].strip()
          gitops_repo = os.environ["GITOPS_REPO"].strip()
          base_branch = os.environ["BASE_BRANCH"].strip()
          staging_file = os.environ["STAGING_FILE"].strip()
          gitops_token = os.environ.get("GITOPS_TOKEN", "").strip()
          app_token = os.environ.get("APP_READ_TOKEN", "").strip()
          api_url = os.environ.get("API_URL", "https://api.github.com").rstrip("/")
          gh_out = os.environ["GITHUB_OUTPUT"]
          esc_app = re.escape(app)
          esc_repo = re.escape(source_repo)

          def extract_sha_from_commit(block: str) -> str:
              repo_m = re.search(r"(?m)^Source-Repository:\s*(\S+)\s*$", block)
              if repo_m and repo_m.group(1).lower() != source_repo.lower():
                  return ""
              rev_m = re.search(r"(?m)^Source-Revision:\s*([0-9a-f]{40})\s*$", block)
              if rev_m and repo_m:
                  return rev_m.group(1)
              src_m = re.search(rf"(?mi)^Source:\s*{esc_repo}@([0-9a-f]{{40}})\s*$", block)
              if src_m:
                  return src_m.group(1)
              subj_m = re.search(
                  rf"(?m)^chore\({esc_app}\):\s*promote\s+([0-9a-f]{{7,40}})\s+to\s+(?:staging|production)\b",
                  block,
              )
              return subj_m.group(1) if subj_m else ""

          watermarks: list[str] = []
          log_out = subprocess.check_output(
              ["git", "log", "-n", "15", "--format=%B%n---COMMIT-END---", "--", staging_file],
              text=True,
          )
          for block in log_out.split("---COMMIT-END---"):
              found = extract_sha_from_commit(block)
              if found:
                  watermarks.append(found)
                  break

          promo_branch = f"promote/{app}/production"
          if gitops_token and gitops_repo:
              try:
                  req_repo = urllib.request.Request(
                      f"{api_url}/repos/{gitops_repo}",
                      headers={"Authorization": f"Bearer {gitops_token}", "Accept": "application/vnd.github+json"},
                  )
                  with urllib.request.urlopen(req_repo, timeout=10) as resp_r:
                      canonical_gitops = json.loads(resp_r.read().decode()).get("full_name", gitops_repo)
              except Exception:
                  canonical_gitops = gitops_repo
              try:
                  q = urllib.parse.urlencode({"state": "open", "base": base_branch, "per_page": "100"})
                  req_prs = urllib.request.Request(
                      f"{api_url}/repos/{canonical_gitops}/pulls?{q}",
                      headers={"Authorization": f"Bearer {gitops_token}", "Accept": "application/vnd.github+json"},
                  )
                  with urllib.request.urlopen(req_prs, timeout=10) as resp_p:
                      for pr in json.loads(resp_p.read().decode()):
                          if ((pr.get("head") or {}).get("ref") or "") != promo_branch:
                              continue
                          body = pr.get("body") or ""
                          mm = re.search(r"<!--\s*gitops-promote:\s*(\{[^\n]*?\})\s*-->", body)
                          if mm:
                              marker = json.loads(mm.group(1))
                              m_sha = str(marker.get("sourceRevision", ""))
                              if re.fullmatch(r"[0-9a-f]{40}", m_sha):
                                  watermarks.append(m_sha)
              except Exception as exc:
                  print(f"Open PR watermark lookup note: {exc}")

          superseded = False
          for wm in dict.fromkeys(watermarks):
              if not wm or wm == source_sha or source_sha.startswith(wm) or not app_token:
                  continue
              url = f"{api_url}/repos/{source_repo}/compare/{source_sha}...{wm}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {app_token}",
                      "Accept": "application/vnd.github+json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode())
                      if data.get("status") == "ahead":
                          superseded = True
                          print(
                              f"Skipping out-of-order staging promotion: newer descendant {wm} is already promoted (ahead of {source_sha})."
                          )
                          break
              except Exception as exc:
                  print(f"Monotonic check note (continuing): {exc}")

          with open(gh_out, "a", encoding="utf-8") as fh:
              fh.write(f"superseded={'true' if superseded else 'false'}\n")
          PY

      - name: Resolve immutable release evidence from registry
        if: steps.monotonic_guard.outputs.superseded != 'true'
        shell: bash
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_revision || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release
          python3 - <<'PY'
          import json, os, urllib.request, hashlib

          matrix_raw = os.environ.get("MATRIX", "{}")
          matrix = json.loads(matrix_raw)
          components = matrix.get("include", []) if isinstance(matrix, dict) else []
          sha = os.environ.get("SOURCE_SHA", "")

          auth_header = None
          for cfg_path in ("/run/secrets/zot/config.json", os.path.expanduser("~/.docker/config.json")):
              if os.path.exists(cfg_path):
                  try:
                      with open(cfg_path, "r", encoding="utf-8") as f:
                          cfg = json.load(f)
                          for reg, auth_data in cfg.get("auths", {}).items():
                              if "auth" in auth_data:
                                  auth_header = f"Basic {auth_data['auth']}"
                                  break
                  except Exception:
                      pass
              if auth_header:
                  break

          for comp in components:
              name = comp["name"]
              image = comp["image"]
              workload = comp["workload"]
              container = comp["container"]
              tag = f"sha-{sha}-{name}"

              parts = image.split("/", 1)
              reg_host = parts[0]
              repo = parts[1]

              url = f"https://{reg_host}/v2/{repo}/manifests/{tag}"
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json"
              })
              if auth_header:
                  req.add_header("Authorization", auth_header)

              ctx = urllib.request.ssl._create_unverified_context()
              with urllib.request.urlopen(req, context=ctx) as resp:
                  digest = resp.headers.get("Docker-Content-Digest")
                  if not digest:
                      payload = resp.read()
                      digest = f"sha256:{hashlib.sha256(payload).hexdigest()}"

              fragment = {
                  "component": name,
                  "image": image,
                  "digest": digest,
                  "workload": workload,
                  "container": container
              }
              out_path = f"release/release-{name}.json"
              with open(out_path, "w", encoding="utf-8") as f:
                  json.dump(fragment, f, sort_keys=True)
              print(f"Resolved {name}: {image}@{digest}")
          PY

      - name: Download T14 builder proofs
        if: steps.monotonic_guard.outputs.superseded != 'true' && needs.prepare.outputs.t14_enabled == 'true'
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8.0.1
        with:
          pattern: t14-builder-proof-*
          path: t14-proofs
          merge-multiple: true

      - name: Verify mounted Zot credentials for T14 baseline publication
        if: steps.monotonic_guard.outputs.superseded != 'true' && needs.prepare.outputs.t14_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s /run/secrets/zot/config.json
          docker_config="$RUNNER_TEMP/.docker"
          install -d -m 0700 "$docker_config"
          install -m 0600 /run/secrets/zot/config.json "$docker_config/config.json"
          grep --fixed-strings --quiet 'registry.lan.kyo.ninja' "$docker_config/config.json"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"

      - name: Update staging image patches
        if: steps.monotonic_guard.outputs.superseded != 'true'
        uses: JustShinobi/platform-workflows/.github/actions/update-gitops-images@0d18d31f2b76cdba12ce469784c60ff2448e1f6d
        with:
          images-file: gitops/${{ needs.prepare.outputs.gitops_staging_path }}/${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'values-stg.yaml' || 'images.yaml' }}
          release-directory: release
          mode: ${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'chart-values' || 'kustomize' }}
          allow-missing-components: ${{ needs.prepare.outputs.t14_only_components || '' }}

      - name: Update T14 image patches
        if: steps.monotonic_guard.outputs.superseded != 'true' && needs.prepare.outputs.t14_enabled == 'true'
        uses: JustShinobi/platform-workflows/.github/actions/update-gitops-images@0d18d31f2b76cdba12ce469784c60ff2448e1f6d
        with:
          images-file: gitops/${{ needs.prepare.outputs.t14_gitops_path }}/images.yaml
          release-directory: release
          t14-targets: ${{ needs.prepare.outputs.t14_builder_targets }}
          t14-component: ${{ needs.prepare.outputs.t14_image_component }}
          t14-shared-components: ${{ needs.prepare.outputs.t14_shared_components }}
          t14-baseline-release-file: ${{ runner.temp }}/t14-baseline/release-t14-baseline-app.fragment.json
          t14-proof-directory: t14-proofs
          t14-builder-key-id: ${{ needs.prepare.outputs.t14_builder_key_id }}
          t14-baseline-source-sha: ${{ needs.prepare.outputs.t14_baseline_source_sha }}
          t14-baseline-workflow-sha: ${{ needs.prepare.outputs.t14_baseline_workflow_sha }}
          t14-proposed-source-sha: ${{ needs.prepare.outputs.source_revision }}
          t14-builder-public-key-file: /run/secrets/t14/builder-key/public-key
          t14-baseline-repository: ${{ needs.prepare.outputs.t14_baseline_repository }}
          t14-baseline-run-id: ${{ needs.prepare.outputs.t14_baseline_run_id }}
          t14-baseline-artifact-name: ${{ needs.prepare.outputs.t14_baseline_artifact_name }}
          t14-baseline-token: ${{ secrets.T14_BASELINE_TOKEN }}

      - name: Stage T14 builder proofs with the image promotion
        if: steps.monotonic_guard.outputs.superseded != 'true' && needs.prepare.outputs.t14_enabled == 'true'
        shell: bash
        env:
          T14_PATH: ${{ needs.prepare.outputs.t14_gitops_path }}
        run: |
          set -euo pipefail
          test "$(find t14-proofs -maxdepth 1 -name '*.dsse' -type f | wc -l)" -eq 6
          proof_dir="gitops/$T14_PATH/proofs"
          install -d -m 0755 "$proof_dir"
          for proof in t14-proofs/*.dsse; do
            install -m 0644 "$proof" "$proof_dir/$(basename "$proof")"
          done

      - name: Commit staging promotion
        id: commit
        if: steps.monotonic_guard.outputs.superseded != 'true'
        working-directory: gitops
        shell: bash
        env:
          APPLICATION: ${{ needs.prepare.outputs.application }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_revision }}
          SOURCE_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ needs.prepare.outputs.t14_enabled == 'true' && needs.prepare.outputs.gitops_staging_branch || needs.prepare.outputs.gitops_base_branch }}
          T14_ENABLED: ${{ needs.prepare.outputs.t14_enabled }}
          T14_PATH: ${{ needs.prepare.outputs.t14_gitops_path }}
        run: |
          set -euo pipefail
          git config user.name "platform-delivery[bot]"
          git config user.email "platform-delivery[bot]@users.noreply.github.com"
          git add -- "${{ needs.prepare.outputs.gitops_staging_path }}/${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'values-stg.yaml' || 'images.yaml' }}"
          if [ "$T14_ENABLED" = true ]; then
            git add -- "$T14_PATH/images.yaml" "$T14_PATH/proofs"
          fi
          if git diff --cached --quiet; then
            echo "No staging image change required"
          else
            git commit \
              -m "chore(${APPLICATION}): promote ${SOURCE_SHA:0:12} to staging" \
              -m "Source-Repository: ${SOURCE_REPO}" \
              -m "Source-Revision: ${SOURCE_SHA}"
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase origin "$TARGET_BRANCH"
              if git push origin "HEAD:$TARGET_BRANCH"; then
                pushed=true
                break
              fi
              echo "Concurrent staging push detected on $TARGET_BRANCH; retrying ($attempt/3)..." >&2
              sleep 2
            done
            if [ "$pushed" != true ]; then
              echo "Failed to push staging promotion to $TARGET_BRANCH after 3 attempts" >&2
              exit 1
            fi
          fi
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Detect T14 Application activation
        id: t14_activation
        if: steps.monotonic_guard.outputs.superseded != 'true'
        shell: bash
        env:
          T14_ENABLED: ${{ needs.prepare.outputs.t14_enabled }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          APPLICATION: ${{ needs.prepare.outputs.t14_gitops_application }}
        run: |
          set -euo pipefail
          if [[ "$T14_ENABLED" != true ]]; then
            printf 'activated=true\npublication_only=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          response_file="$RUNNER_TEMP/t14-application.json"
          http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
            "$ARGOCD_SERVER/api/v1/applications/$APPLICATION")"
          case "$http_code" in
            200)
              jq -e --arg application "$APPLICATION" \
                '.metadata.name == $application' "$response_file" >/dev/null
              printf 'activated=true\npublication_only=false\n' >> "$GITHUB_OUTPUT"
              echo "T14 Application $APPLICATION is active; retaining the Argo health gate."
              ;;
            404)
              printf 'activated=false\npublication_only=true\n' >> "$GITHUB_OUTPUT"
              echo "T14 Application $APPLICATION is not activated (Argo CD returned HTTP 404)."
              ;;
            *)
              echo "Could not determine whether T14 Application $APPLICATION is active (Argo CD returned HTTP $http_code)." >&2
              exit 1
              ;;
          esac

      - name: Report T14 publication-only result
        if: steps.monotonic_guard.outputs.superseded != 'true' && needs.prepare.outputs.t14_enabled == 'true' && steps.t14_activation.outputs.activated == 'false'
        shell: bash
        env:
          APPLICATION: ${{ needs.prepare.outputs.t14_gitops_application }}
          REVISION: ${{ steps.commit.outputs.revision }}
        run: |
          set -euo pipefail
          echo "T14 publication-only: verified image digests and DSSE proofs were committed at GitOps revision $REVISION."
          echo "T14 Application $APPLICATION is not activated; Argo health and production promotion are deferred until a separate activation-aware run."
          {
            echo "### T14 publication-only"
            echo
            echo "The GitOps Application `$APPLICATION` is not activated (Argo CD returned HTTP 404)."
            echo "Verified image digests and builder DSSE proofs were committed at revision `$REVISION`."
            echo "Argo health and production promotion are deferred until a separate activation-aware run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Argo CD staging health
        if: steps.monotonic_guard.outputs.superseded != 'true' && (needs.prepare.outputs.t14_enabled != 'true' || steps.t14_activation.outputs.activated == 'true')
        shell: bash
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          APPLICATION: ${{ needs.prepare.outputs.gitops_staging_application }}
          REVISION: ${{ steps.commit.outputs.revision }}
        run: |
          set -euo pipefail
          check_ready() {
            local query="${1:-}"
            local status
            status="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
              "$ARGOCD_SERVER/api/v1/applications/${APPLICATION}${query}")"
            jq -e --arg rev "$REVISION" '
              (.status.health.status // "") == "Healthy" and
              (.status.sync.status // "") == "Synced" and
              ((.status.sync.revision // "") == $rev or ((.status.sync.revisions // []) | index($rev) != null))
            ' <<<"$status" >/dev/null
          }
          if check_ready "?refresh=normal"; then
            exit 0
          fi
          deadline=$(( $(date +%s) + 600 ))
          while (( $(date +%s) < deadline )); do
            rem=$(( deadline - $(date +%s) ))
            (( rem > 0 )) || break
            window=$(( rem < 5 ? rem : 5 ))
            while IFS= read -r line; do
              payload="${line#data:}"
              payload="${payload#"${payload%%[![:space:]]*}"}"
              [[ "$payload" == \{* ]] || continue
              if jq -e --arg rev "$REVISION" '
                (.result.application.status.health.status // "") == "Healthy" and
                (.result.application.status.sync.status // "") == "Synced" and
                ((.result.application.status.sync.revision // "") == $rev or ((.result.application.status.sync.revisions // []) | index($rev) != null))
              ' <<<"$payload" >/dev/null 2>&1; then
                exit 0
              fi
            done < <(curl --silent --no-buffer --max-time "$window" \
              -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
              "$ARGOCD_SERVER/api/v1/stream/applications?name=${APPLICATION}" || true)
            if check_ready ""; then
              exit 0
            fi
          done
          echo "Argo CD did not reconcile $APPLICATION to $REVISION in 10 minutes" >&2
          exit 1

      - name: Wait for Argo CD T14 health
        if: steps.monotonic_guard.outputs.superseded != 'true' && needs.prepare.outputs.t14_enabled == 'true' && steps.t14_activation.outputs.activated == 'true'
        shell: bash
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          APPLICATION: ${{ needs.prepare.outputs.t14_gitops_application }}
          REVISION: ${{ steps.commit.outputs.revision }}
        run: |
          set -euo pipefail
          check_ready() {
            local query="${1:-}"
            local status
            status="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
              "$ARGOCD_SERVER/api/v1/applications/${APPLICATION}${query}")"
            jq -e --arg rev "$REVISION" '
              (.status.health.status // "") == "Healthy" and
              (.status.sync.status // "") == "Synced" and
              ((.status.sync.revision // "") == $rev or ((.status.sync.revisions // []) | index($rev) != null))
            ' <<<"$status" >/dev/null
          }
          if check_ready "?refresh=normal"; then
            exit 0
          fi
          deadline=$(( $(date +%s) + 600 ))
          while (( $(date +%s) < deadline )); do
            rem=$(( deadline - $(date +%s) ))
            (( rem > 0 )) || break
            window=$(( rem < 5 ? rem : 5 ))
            while IFS= read -r line; do
              payload="${line#data:}"
              payload="${payload#"${payload%%[![:space:]]*}"}"
              [[ "$payload" == \{* ]] || continue
              if jq -e --arg rev "$REVISION" '
                (.result.application.status.health.status // "") == "Healthy" and
                (.result.application.status.sync.status // "") == "Synced" and
                ((.result.application.status.sync.revision // "") == $rev or ((.result.application.status.sync.revisions // []) | index($rev) != null))
              ' <<<"$payload" >/dev/null 2>&1; then
                exit 0
              fi
            done < <(curl --silent --no-buffer --max-time "$window" \
              -H "Authorization: Bearer $ARGOCD_AUTH_TOKEN" \
              "$ARGOCD_SERVER/api/v1/stream/applications?name=${APPLICATION}" || true)
            if check_ready ""; then
              exit 0
            fi
          done
          echo "Argo CD did not reconcile $APPLICATION to $REVISION in 10 minutes" >&2
          exit 1

      - name: Check out application for smoke test
        if: steps.monotonic_guard.outputs.superseded != 'true' && (needs.prepare.outputs.t14_enabled != 'true' || steps.t14_activation.outputs.activated == 'true')
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_revision }}
          path: application
          persist-credentials: false

      - name: Set up Node.js runtime
        if: steps.monotonic_guard.outputs.superseded != 'true' && (needs.prepare.outputs.t14_enabled != 'true' || steps.t14_activation.outputs.activated == 'true')
        uses: actions/setup-node@3d7870f6218881292d183093179901ae8dc2ef85 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run fixed staging smoke contract
        if: steps.monotonic_guard.outputs.superseded != 'true' && (needs.prepare.outputs.t14_enabled != 'true' || steps.t14_activation.outputs.activated == 'true')
        working-directory: application
        shell: bash
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          test -x scripts/ci/smoke-stg
          scripts/ci/smoke-stg

  propose-production:
    name: Open or update production promotion PR
    needs: [prepare, build, promote-staging]
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.build.result == 'success' &&
      needs.prepare.outputs.t14_build_only != 'true' &&
      needs.prepare.outputs.promotion_mode != 'staging-only' &&
      needs.promote-staging.outputs.superseded != 'true' &&
      (
        needs.promote-staging.result == 'success' ||
        (needs.promote-staging.result == 'skipped' && needs.prepare.outputs.promotion_mode == 'production-only')
      ) &&
      (needs.prepare.outputs.t14_enabled != 'true' ||
      needs.promote-staging.outputs.t14_application_activated == 'true')
    runs-on: arc-k3s-light
    timeout-minutes: 15
    steps:
      - name: Resolve GitOps authentication token (GitHub App or PAT fallback)
        id: gitops_token
        shell: bash
        env:
          GITOPS_TOKEN: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
          GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
          GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          GITOPS_REPO: ${{ needs.prepare.outputs.gitops_repository }}
        run: |
          set -euo pipefail
          if [ -n "${GITOPS_APP_ID}" ] && [ -n "${GITOPS_APP_PRIVATE_KEY}" ]; then
            TOKEN="$(python3 - <<'PY'
          import base64, json, os, subprocess, time, urllib.request
          def b64url(b: bytes) -> str:
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          app_id = os.environ["GITOPS_APP_ID"].strip()
          priv_key = os.environ["GITOPS_APP_PRIVATE_KEY"].strip()
          owner = os.environ.get("GITOPS_REPO", "Shhinobi/k3s-gitops-prod").split("/", 1)[0]
          now = int(time.time())
          h = b64url(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
          p = b64url(json.dumps({"iat": now - 60, "exp": now + 300, "iss": app_id}).encode())
          proc = subprocess.run(
              ["bash", "-c", 'openssl dgst -sha256 -sign <(printf "%s" "$PRIV_KEY")'],
              input=f"{h}.{p}".encode(),
              env={"PRIV_KEY": priv_key, "PATH": "/usr/bin:/bin"},
              capture_output=True,
              check=True,
          )
          jwt_tok = f"{h}.{p}.{b64url(proc.stdout)}"
          req = urllib.request.Request(
              "https://api.github.com/app/installations",
              headers={"Authorization": f"Bearer {jwt_tok}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req) as resp:
              installs = json.loads(resp.read().decode())
          inst_id = next(
              (str(i["id"]) for i in installs if i.get("account", {}).get("login", "").lower() == owner.lower()),
              str(installs[0]["id"]) if installs else "",
          )
          req2 = urllib.request.Request(
              f"https://api.github.com/app/installations/{inst_id}/access_tokens",
              method="POST",
              headers={"Authorization": f"Bearer {jwt_tok}", "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req2) as resp2:
              print(json.loads(resp2.read().decode())["token"])
          PY
            )"
            echo "::add-mask::${TOKEN}"
            echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"
          elif [ -n "${GITOPS_TOKEN}" ]; then
            echo "token=${GITOPS_TOKEN}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither GITOPS_APP_ID/GITOPS_APP_PRIVATE_KEY nor PLATFORM_GITOPS_TOKEN is configured."
            exit 1
          fi

      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.gitops_repository }}
          ref: ${{ needs.prepare.outputs.gitops_base_branch }}
          fetch-depth: 0
          token: ${{ steps.gitops_token.outputs.token }}
          path: gitops

      - name: Resolve immutable release evidence from registry
        shell: bash
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_revision || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release
          python3 - <<'PY'
          import json, os, urllib.request, hashlib

          matrix_raw = os.environ.get("MATRIX", "{}")
          matrix = json.loads(matrix_raw)
          components = matrix.get("include", []) if isinstance(matrix, dict) else []
          sha = os.environ.get("SOURCE_SHA", "")

          auth_header = None
          for cfg_path in ("/run/secrets/zot/config.json", os.path.expanduser("~/.docker/config.json")):
              if os.path.exists(cfg_path):
                  try:
                      with open(cfg_path, "r", encoding="utf-8") as f:
                          cfg = json.load(f)
                          for reg, auth_data in cfg.get("auths", {}).items():
                              if "auth" in auth_data:
                                  auth_header = f"Basic {auth_data['auth']}"
                                  break
                  except Exception:
                      pass
              if auth_header:
                  break

          for comp in components:
              name = comp["name"]
              image = comp["image"]
              workload = comp["workload"]
              container = comp["container"]
              tag = f"sha-{sha}-{name}"

              parts = image.split("/", 1)
              reg_host = parts[0]
              repo = parts[1]

              url = f"https://{reg_host}/v2/{repo}/manifests/{tag}"
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json"
              })
              if auth_header:
                  req.add_header("Authorization", auth_header)

              ctx = urllib.request.ssl._create_unverified_context()
              with urllib.request.urlopen(req, context=ctx) as resp:
                  digest = resp.headers.get("Docker-Content-Digest")
                  if not digest:
                      payload = resp.read()
                      digest = f"sha256:{hashlib.sha256(payload).hexdigest()}"

              fragment = {
                  "component": name,
                  "image": image,
                  "digest": digest,
                  "workload": workload,
                  "container": container
              }
              out_path = f"release/release-{name}.json"
              with open(out_path, "w", encoding="utf-8") as f:
                  json.dump(fragment, f, sort_keys=True)
              print(f"Resolved {name}: {image}@{digest}")
          PY

      - name: Capture current production baseline
        id: baseline
        working-directory: gitops
        shell: bash
        env:
          APPLICATION: ${{ needs.prepare.outputs.application }}
          SOURCE_REPO: ${{ github.repository }}
          PROD_FILE: ${{ needs.prepare.outputs.gitops_production_path }}/${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'values-prd.yaml' || 'images.yaml' }}
          IMAGE_PROMOTION: ${{ needs.prepare.outputs.image_promotion }}
          BASELINE_JSON: ${{ runner.temp }}/prod-baseline.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          app = os.environ["APPLICATION"].strip()
          source_repo = os.environ["SOURCE_REPO"].strip()
          prod_file = Path(os.environ["PROD_FILE"])
          mode = os.environ.get("IMAGE_PROMOTION", "kustomize-images")
          out_file = Path(os.environ["BASELINE_JSON"])
          esc_app = re.escape(app)
          esc_repo = re.escape(source_repo)

          prev_source_sha = ""
          if prod_file.exists():
              log_out = subprocess.check_output(
                  ["git", "log", "-n", "20", "--format=%B%n---COMMIT-END---", "--", str(prod_file)],
                  text=True,
              )
              for block in log_out.split("---COMMIT-END---"):
                  repo_m = re.search(r"(?m)^Source-Repository:\s*(\S+)\s*$", block)
                  if repo_m and repo_m.group(1).lower() != source_repo.lower():
                      continue
                  m = re.search(r"(?m)^Source-Revision:\s*([0-9a-f]{40})\s*$", block) if repo_m else None
                  if not m:
                      m = re.search(rf"(?mi)^Source:\s*{esc_repo}@([0-9a-f]{{40}})\s*$", block)
                  if not m:
                      m = re.search(
                          rf"(?m)^chore\({esc_app}\):\s*promote\s+([0-9a-f]{{7,40}})\s+to\s+production\b",
                          block,
                      )
                  if m:
                      prev_source_sha = m.group(1)
                      break

          digests = {}
          if prod_file.exists():
              raw = prod_file.read_text(encoding="utf-8")
              try:
                  import yaml
                  if mode == "chart-values":
                      doc = yaml.safe_load(raw)
                      if isinstance(doc, dict):
                          sections = []
                          if isinstance(doc.get("fullnameOverride"), str):
                              sections.append(doc)
                          comps = doc.get("components")
                          if isinstance(comps, dict):
                              sections.extend(v for v in comps.values() if isinstance(v, dict))
                          sections.extend(
                              v
                              for k, v in doc.items()
                              if k not in {"components", "defaults"} and isinstance(v, dict)
                          )
                          for vals in sections:
                              w = vals.get("fullnameOverride")
                              if not isinstance(w, str) or not w:
                                  continue
                              img = vals.get("image")
                              cname = vals.get("containerName")
                              primary = cname if isinstance(cname, str) and cname else w
                              if isinstance(img, dict) and isinstance(img.get("digest"), str):
                                  digests[w] = img["digest"]
                                  digests[f"{w}/{primary}"] = img["digest"]
                              for list_key in ("extraContainers", "initContainers"):
                                  for c in vals.get(list_key) or []:
                                      if (
                                          isinstance(c, dict)
                                          and c.get("name")
                                          and isinstance(c.get("image"), str)
                                      ):
                                          m_dig = re.search(r"(sha256:[0-9a-f]{64})", c["image"])
                                          if m_dig:
                                              digests[f"{w}/{c['name']}"] = m_dig.group(1)
                  else:
                      for doc in yaml.safe_load_all(raw):
                          if not isinstance(doc, dict) or doc.get("kind") != "Deployment":
                              continue
                          w = (doc.get("metadata") or {}).get("name")
                          containers = (((doc.get("spec") or {}).get("template") or {}).get("spec") or {}).get("containers") or []
                          for c in containers:
                              if isinstance(c, dict) and w and c.get("name") and isinstance(c.get("image"), str):
                                  m_dig = re.search(r"(sha256:[0-9a-f]{64})", c["image"])
                                  if m_dig:
                                      digests[f"{w}/{c['name']}"] = m_dig.group(1)
              except Exception:
                  if mode == "chart-values":
                      cur_full = ""
                      cur_cname = ""
                      primary_recorded = False
                      containers_indent = -1
                      item_prop_indent = -1
                      item_name = ""
                      item_digest = ""
                      for line in raw.splitlines():
                          if not line.strip() or line.lstrip().startswith("#"):
                              continue
                          m_f = re.match(r"^(\s*)fullnameOverride:\s*['\"]?([a-z0-9-]+)['\"]?\s*$", line)
                          if m_f:
                              cur_full = m_f.group(2)
                              cur_cname = ""
                              primary_recorded = False
                              containers_indent = -1
                              item_prop_indent = -1
                              item_name = ""
                              item_digest = ""
                              continue
                          if not cur_full:
                              continue
                          m_blk = re.match(r"^(\s*)(?:extraContainers|initContainers):\s*$", line)
                          if m_blk:
                              containers_indent = len(m_blk.group(1))
                              item_prop_indent = -1
                              item_name = ""
                              item_digest = ""
                              continue
                          if containers_indent >= 0:
                              lead = len(line) - len(line.lstrip(" "))
                              m_dash = re.match(r"^(\s*)-\s+(.*)$", line)
                              if lead < containers_indent or (lead == containers_indent and not m_dash):
                                  containers_indent = -1
                                  item_prop_indent = -1
                                  item_name = ""
                                  item_digest = ""
                              elif m_dash and (item_prop_indent < 0 or len(m_dash.group(1)) < item_prop_indent):
                                  dash_indent = len(m_dash.group(1))
                                  rest = m_dash.group(2)
                                  item_prop_indent = dash_indent + (len(line) - dash_indent - len(rest))
                                  item_name = ""
                                  item_digest = ""
                                  m_in0 = re.match(r"^name:\s*['\"]?([a-z0-9-]+)['\"]?\s*$", rest)
                                  if m_in0:
                                      item_name = m_in0.group(1)
                                  m_im0 = re.match(r"^image:\s*['\"]?\S+@(sha256:[0-9a-f]{64})['\"]?\s*$", rest)
                                  if m_im0:
                                      item_digest = m_im0.group(1)
                                  continue
                              elif lead == item_prop_indent:
                                  prop = line.lstrip(" ")
                                  m_in = re.match(r"^name:\s*['\"]?([a-z0-9-]+)['\"]?\s*$", prop)
                                  if m_in:
                                      item_name = m_in.group(1)
                                      if item_digest:
                                          digests[f"{cur_full}/{item_name}"] = item_digest
                                          item_name = ""
                                          item_digest = ""
                                      continue
                                  m_im = re.match(r"^image:\s*['\"]?\S+@(sha256:[0-9a-f]{64})['\"]?\s*$", prop)
                                  if m_im:
                                      item_digest = m_im.group(1)
                                      if item_name:
                                          digests[f"{cur_full}/{item_name}"] = item_digest
                                          item_name = ""
                                          item_digest = ""
                                      continue
                              continue
                          m_cn = re.match(r"^\s*containerName:\s*['\"]?([a-z0-9-]+)['\"]?\s*$", line)
                          if m_cn:
                              cur_cname = m_cn.group(1)
                              if cur_full in digests:
                                  digests[f"{cur_full}/{cur_cname}"] = digests[cur_full]
                              continue
                          m_d = re.match(r"^\s*digest:\s*['\"]?(sha256:[0-9a-f]{64})['\"]?\s*$", line)
                          if m_d and not primary_recorded:
                              digests[cur_full] = m_d.group(1)
                              digests[f"{cur_full}/{cur_cname or cur_full}"] = m_d.group(1)
                              primary_recorded = True
                  else:
                      for doc_block in raw.split("\n---"):
                          m_meta = re.search(r"(?m)^metadata:\s*\n(?:\s+.*\n)*?\s+name:\s*([a-z0-9-]+)", doc_block)
                          if not m_meta:
                              continue
                          w_name = m_meta.group(1)
                          for m_c in re.finditer(
                              r"-\s*name:\s*([a-z0-9-]+)\s*\n\s*image:\s*\S+@(sha256:[0-9a-f]{64})",
                              doc_block,
                          ):
                              digests[f"{w_name}/{m_c.group(1)}"] = m_c.group(2)

          out_file.write_text(
              json.dumps({"prev_source_sha": prev_source_sha, "digests": digests}, sort_keys=True),
              encoding="utf-8",
          )
          PY

      - name: Update production image patches
        uses: JustShinobi/platform-workflows/.github/actions/update-gitops-images@0d18d31f2b76cdba12ce469784c60ff2448e1f6d
        with:
          images-file: gitops/${{ needs.prepare.outputs.gitops_production_path }}/${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'values-prd.yaml' || 'images.yaml' }}
          release-directory: release
          mode: ${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'chart-values' || 'kustomize' }}
          allow-missing-components: ${{ needs.prepare.outputs.t14_only_components || '' }}

      - name: Prepare production promotion branch
        id: production
        working-directory: gitops
        shell: bash
        env:
          APPLICATION: ${{ needs.prepare.outputs.application }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_revision }}
          SOURCE_REPO: ${{ github.repository }}
          GITOPS_REPO: ${{ needs.prepare.outputs.gitops_repository }}
          BASE_BRANCH: ${{ needs.prepare.outputs.gitops_base_branch }}
          PROD_FILE: ${{ needs.prepare.outputs.gitops_production_path }}/${{ needs.prepare.outputs.image_promotion == 'chart-values' && 'values-prd.yaml' || 'images.yaml' }}
          EXPLICIT_SOURCE_REVISION: ${{ needs.prepare.outputs.explicit_source_revision }}
          GITOPS_TOKEN: ${{ steps.gitops_token.outputs.token }}
          APP_READ_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          branch="promote/${APPLICATION}/production"
          updated_copy="$RUNNER_TEMP/updated-prod-target.yaml"
          cp "$PROD_FILE" "$updated_copy"

          git config user.name "platform-delivery[bot]"
          git config user.email "platform-delivery[bot]@users.noreply.github.com"

          check_superseded() {
            local has_remote_branch="$1"
            if [ "$EXPLICIT_SOURCE_REVISION" = true ]; then
              return 1
            fi
            local ahead_sha
            ahead_sha="$(HAS_REMOTE_BRANCH="$has_remote_branch" BRANCH_NAME="$branch" python3 - <<'PY'
          import json, os, re, subprocess, urllib.parse, urllib.request

          app = os.environ["APPLICATION"].strip()
          source_sha = os.environ["SOURCE_SHA"].strip()
          source_repo = os.environ["SOURCE_REPO"].strip()
          gitops_repo = os.environ.get("GITOPS_REPO", "").strip()
          base_branch = os.environ["BASE_BRANCH"].strip()
          prod_file = os.environ["PROD_FILE"].strip()
          branch_name = os.environ["BRANCH_NAME"].strip()
          has_remote = os.environ["HAS_REMOTE_BRANCH"] == "true"
          gitops_token = os.environ.get("GITOPS_TOKEN", "").strip()
          app_token = os.environ.get("APP_READ_TOKEN", "").strip()
          api_url = os.environ.get("API_URL", "https://api.github.com").rstrip("/")
          esc_app = re.escape(app)
          esc_repo = re.escape(source_repo)

          def extract_sha(block: str) -> str:
              repo_m = re.search(r"(?m)^Source-Repository:\s*(\S+)\s*$", block)
              if repo_m and repo_m.group(1).lower() != source_repo.lower():
                  return ""
              m = re.search(r"(?m)^Source-Revision:\s*([0-9a-f]{40})\s*$", block) if repo_m else None
              if not m:
                  m = re.search(rf"(?mi)^Source:\s*{esc_repo}@([0-9a-f]{{40}})\s*$", block)
              if not m:
                  m = re.search(
                      rf"(?m)^chore\({esc_app}\):\s*promote\s+([0-9a-f]{{7,40}})\s+to\s+production\b",
                      block,
                  )
              return m.group(1) if m else ""

          watermarks: list[str] = []

          # Watermark 1: latest production commit on origin/<base_branch> (survives delete_branch_on_merge)
          base_log = subprocess.check_output(
              ["git", "log", "-n", "15", f"origin/{base_branch}", "--format=%B%n---COMMIT-END---", "--", prod_file],
              text=True,
          )
          for block in base_log.split("---COMMIT-END---"):
              found = extract_sha(block)
              if found:
                  watermarks.append(found)
                  break

          # Watermark 2: commit on origin/promote/<app>/production (if remote branch exists)
          if has_remote:
              branch_msg = subprocess.check_output(
                  ["git", "log", "-n", "1", "--format=%B", f"origin/{branch_name}"], text=True
              )
              found_b = extract_sha(branch_msg)
              if found_b:
                  watermarks.append(found_b)

          # Watermark 3: open PR body marker (prevents split-brain after unchanged_digests=true)
          if gitops_token and gitops_repo:
              try:
                  req_repo = urllib.request.Request(
                      f"{api_url}/repos/{gitops_repo}",
                      headers={"Authorization": f"Bearer {gitops_token}", "Accept": "application/vnd.github+json"},
                  )
                  with urllib.request.urlopen(req_repo, timeout=10) as resp_r:
                      canonical_gitops = json.loads(resp_r.read().decode()).get("full_name", gitops_repo)
              except Exception:
                  canonical_gitops = gitops_repo
              try:
                  q = urllib.parse.urlencode({"state": "open", "base": base_branch, "per_page": "100"})
                  req_prs = urllib.request.Request(
                      f"{api_url}/repos/{canonical_gitops}/pulls?{q}",
                      headers={"Authorization": f"Bearer {gitops_token}", "Accept": "application/vnd.github+json"},
                  )
                  with urllib.request.urlopen(req_prs, timeout=10) as resp_p:
                      for pr in json.loads(resp_p.read().decode()):
                          if ((pr.get("head") or {}).get("ref") or "") != branch_name:
                              continue
                          body = pr.get("body") or ""
                          mm = re.search(r"<!--\s*gitops-promote:\s*(\{[^\n]*?\})\s*-->", body)
                          if mm:
                              marker = json.loads(mm.group(1))
                              m_sha = str(marker.get("sourceRevision", ""))
                              if re.fullmatch(r"[0-9a-f]{40}", m_sha):
                                  watermarks.append(m_sha)
              except Exception:
                  pass

          for wm in dict.fromkeys(watermarks):
              if not wm or wm == source_sha or source_sha.startswith(wm) or not app_token:
                  continue
              url = f"{api_url}/repos/{source_repo}/compare/{source_sha}...{wm}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {app_token}",
                      "Accept": "application/vnd.github+json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode())
                      if data.get("status") == "ahead":
                          print(wm)
                          raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception:
                  pass
          print("")
          PY
            )"
            if [ -n "$ahead_sha" ]; then
              echo "Skipping out-of-order production promotion: newer descendant $ahead_sha is already promoted"
              {
                printf 'branch=%s\n' "$branch"
                printf 'has_changes=true\n'
                printf 'pushed=false\n'
                printf 'unchanged_digests=false\n'
                printf 'superseded=true\n'
              } >> "$GITHUB_OUTPUT"
              return 0
            fi
            return 1
          }

          git add -- "$PROD_FILE"
          if git diff --cached --quiet; then
            echo "Production already references these digests"
            {
              printf 'branch=%s\n' "$branch"
              printf 'has_changes=false\n'
              printf 'pushed=false\n'
              printf 'unchanged_digests=false\n'
              printf 'superseded=false\n'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pushed=false
          for attempt in 1 2 3; do
            git fetch --no-tags origin "refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
            remote_oid=""
            has_remote_branch="false"
            if remote_line="$(git ls-remote --exit-code --heads origin "refs/heads/$branch" 2>/dev/null)"; then
              remote_oid="${remote_line%%[[:space:]]*}"
              has_remote_branch="true"
              git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            else
              status=$?
              if [ "$status" -ne 2 ]; then
                echo "Could not determine whether production promotion branch $branch exists" >&2
                exit "$status"
              fi
            fi

            if check_superseded "$has_remote_branch"; then
              exit 0
            fi

            if [ "$has_remote_branch" = true ]; then
              remote_prod_copy="$RUNNER_TEMP/remote-branch-prod-target.yaml"
              if git show "origin/$branch:$PROD_FILE" > "$remote_prod_copy" 2>/dev/null && \
                 cmp -s "$updated_copy" "$remote_prod_copy" && \
                 git merge-tree --write-tree "origin/$BASE_BRANCH" "origin/$branch" >/dev/null 2>&1; then
                echo "Reusing existing production promotion branch $branch (identical image digests and cleanly mergeable)"
                {
                  printf 'branch=%s\n' "$branch"
                  printf 'has_changes=true\n'
                  printf 'pushed=false\n'
                  printf 'unchanged_digests=true\n'
                  printf 'superseded=false\n'
                } >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi

            git switch -f -C "$branch" "origin/$BASE_BRANCH"
            cp "$updated_copy" "$PROD_FILE"
            git add -- "$PROD_FILE"
            if git diff --cached --quiet; then
              echo "Production already references these digests"
              {
                printf 'branch=%s\n' "$branch"
                printf 'has_changes=false\n'
                printf 'pushed=false\n'
                printf 'unchanged_digests=false\n'
                printf 'superseded=false\n'
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit \
              -m "chore(${APPLICATION}): promote ${SOURCE_SHA:0:12} to production" \
              -m "Source-Repository: ${SOURCE_REPO}" \
              -m "Source-Revision: ${SOURCE_SHA}"
            if git push --force-with-lease="refs/heads/${branch}:${remote_oid}" origin "HEAD:refs/heads/${branch}"; then
              pushed=true
              break
            fi
            echo "Concurrent update detected on $branch; retrying ($attempt/3)..." >&2
            sleep 2
          done

          if [ "$pushed" != true ]; then
            echo "Failed to update rolling production promotion branch $branch after 3 attempts" >&2
            exit 1
          fi

          {
            printf 'branch=%s\n' "$branch"
            printf 'has_changes=true\n'
            printf 'pushed=true\n'
            printf 'unchanged_digests=false\n'
            printf 'superseded=false\n'
          } >> "$GITHUB_OUTPUT"

      - name: Create or update production pull request
        if: steps.production.outputs.superseded != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPOSITORY: ${{ needs.prepare.outputs.gitops_repository }}
          HEAD_BRANCH: ${{ steps.production.outputs.branch }}
          BASE_BRANCH: ${{ needs.prepare.outputs.gitops_base_branch }}
          APPLICATION: ${{ needs.prepare.outputs.application }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_revision }}
          PROMOTION_MODE: ${{ needs.prepare.outputs.promotion_mode }}
          IMAGE_PROMOTION: ${{ needs.prepare.outputs.image_promotion }}
          PRODUCTION_PATH: ${{ needs.prepare.outputs.gitops_production_path }}
          PRODUCTION_APP: ${{ needs.prepare.outputs.gitops_production_application }}
          STAGING_APP: ${{ needs.prepare.outputs.gitops_staging_application }}
          EXPLICIT_SOURCE_REVISION: ${{ needs.prepare.outputs.explicit_source_revision }}
          HAS_CHANGES: ${{ steps.production.outputs.has_changes }}
          UNCHANGED_DIGESTS: ${{ steps.production.outputs.unchanged_digests }}
          BASELINE_FILE: ${{ runner.temp }}/prod-baseline.json
          RELEASE_DIR: release
          APP_READ_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.gitops_token.outputs.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const [rawOwner, rawRepo] = process.env.REPOSITORY.split('/');
            let owner = rawOwner;
            let repo = rawRepo;
            try {
              const repoInfo = await github.rest.repos.get({ owner: rawOwner, repo: rawRepo });
              owner = repoInfo.data.owner.login;
              repo = repoInfo.data.name;
            } catch (err) {
              core.info(`Using configured GitOps repository coordinates ${owner}/${repo}: ${err.message}`);
            }

            const head = process.env.HEAD_BRANCH;
            const baseBranch = process.env.BASE_BRANCH;
            const app = process.env.APPLICATION;
            const sha = process.env.SOURCE_SHA;
            const shortSha = sha.slice(0, 12);
            const hasChanges = process.env.HAS_CHANGES !== 'false';
            const unchangedDigests = process.env.UNCHANGED_DIGESTS === 'true';
            const promotionMode = process.env.PROMOTION_MODE || 'staging-and-production';
            const imagePromotion = process.env.IMAGE_PROMOTION || 'kustomize-images';
            const prodPath = process.env.PRODUCTION_PATH || '';
            const prodApp = process.env.PRODUCTION_APP || `prd-${app}`;
            const stgApp = process.env.STAGING_APP || `stg-${app}`;
            if (!head) return;

            const srcRepoFull = `${context.repo.owner}/${context.repo.repo}`;
            const serverUrl = context.serverUrl || 'https://github.com';
            const apiUrl = (process.env.GITHUB_API_URL || 'https://api.github.com').replace(/\/$/, '');

            let baseline = { prev_source_sha: '', digests: {} };
            try {
              if (process.env.BASELINE_FILE && fs.existsSync(process.env.BASELINE_FILE)) {
                baseline = JSON.parse(fs.readFileSync(process.env.BASELINE_FILE, 'utf8'));
              }
            } catch (err) {
              core.warning(`Could not parse production baseline metadata: ${err.message}`);
            }

            const releaseRecords = [];
            try {
              const relDir = process.env.RELEASE_DIR || 'release';
              if (fs.existsSync(relDir)) {
                for (const entry of fs.readdirSync(relDir).sort()) {
                  if (!entry.endsWith('.json') || entry.endsWith('.spdx.json')) continue;
                  releaseRecords.push(JSON.parse(fs.readFileSync(path.join(relDir, entry), 'utf8')));
                }
              }
            } catch (err) {
              core.warning(`Could not read release fragments: ${err.message}`);
            }

            let resolvedPrevSha = baseline.prev_source_sha || '';
            let commitLines = [];
            let totalCommits = 0;
            const appToken = process.env.APP_READ_TOKEN || '';
            if (resolvedPrevSha && resolvedPrevSha !== sha && !sha.startsWith(resolvedPrevSha) && appToken) {
              try {
                const resp = await fetch(
                  `${apiUrl}/repos/${srcRepoFull}/compare/${encodeURIComponent(resolvedPrevSha)}...${encodeURIComponent(sha)}`,
                  {
                    headers: {
                      Authorization: `Bearer ${appToken}`,
                      Accept: 'application/vnd.github+json',
                    },
                  }
                );
                if (resp.ok) {
                  const cmp = await resp.json();
                  if (cmp.base_commit && cmp.base_commit.sha) {
                    resolvedPrevSha = cmp.base_commit.sha;
                  }
                  const commits = Array.isArray(cmp.commits) ? cmp.commits : [];
                  totalCommits = typeof cmp.total_commits === 'number' ? cmp.total_commits : commits.length;
                  const recent = commits.slice(-15).reverse();
                  commitLines = recent.map((c) => {
                    const cShort = String(c.sha || '').slice(0, 7);
                    const rawHeadline = String((c.commit && c.commit.message) || '').split(/\r?\n/, 1)[0];
                    const safeHeadline = rawHeadline
                      .replace(/[`<>]/g, '')
                      .replace(/\|/g, '\\|')
                      .trim()
                      .slice(0, 120);
                    return `- [\`${cShort}\`](${serverUrl}/${srcRepoFull}/commit/${c.sha})${safeHeadline ? ` \`${safeHeadline}\`` : ''}`;
                  });
                }
              } catch (err) {
                core.info(`Could not fetch commit range for PR body: ${err.message}`);
              }
            }

            const escapeCell = (val) => String(val || '').replace(/\|/g, '\\|');
            const shortDigest = (d) => (d && d.startsWith('sha256:') ? `\`sha256:${d.slice(7, 19)}…\`` : '—');

            const buildPrBody = () => {
              const validationSummary = promotionMode === 'production-only'
                ? 'validated by the repository CI verification contract (`production-only`)'
                : `validated in staging (\`${stgApp}\` Synced & Healthy + \`smoke-stg\` passed)`;

              const prodRevCell = resolvedPrevSha
                ? `[\`${srcRepoFull}@${resolvedPrevSha.slice(0, 12)}\`](${serverUrl}/${srcRepoFull}/commit/${resolvedPrevSha}) ([compare](${serverUrl}/${srcRepoFull}/compare/${resolvedPrevSha}...${sha}))`
                : '_Not recorded on previous manifest commit_';

              const lines = [
                `<!-- gitops-promote: ${JSON.stringify({ application: app, sourceRepo: srcRepoFull, sourceRevision: sha })} -->`,
                `## 🚀 Production Promotion — \`${app}\``,
                '',
                `Promotes the exact immutable OCI image digests ${validationSummary} to **\`${prodApp}\`** (\`${prodPath}\`).`,
                `> 🔄 _Rolling promotion PR on \`${head}\` — automatically updated in-place as new revisions are validated._`,
              ];

              if (unchangedDigests) {
                lines.push(
                  `> ℹ️ _Runtime container digests are identical to the existing candidate on \`${head}\`; Git branch \`HEAD\` was preserved to retain green CI checks and review state._`
                );
              }

              lines.push(
                '',
                '| Metadata | Value |',
                '| :--- | :--- |',
                `| **Candidate Revision** | [\`${srcRepoFull}@${shortSha}\`](${serverUrl}/${srcRepoFull}/commit/${sha}) |`,
                `| **Current Production** | ${prodRevCell} |`,
                `| **Validation Gate** | \`${promotionMode}\` |`,
                `| **Release Pipeline** | [Run #${context.runId}](${serverUrl}/${srcRepoFull}/actions/runs/${context.runId}) |`
              );

              if (releaseRecords.length > 0) {
                lines.push(
                  '',
                  '### 📦 Component Image Digests',
                  '',
                  '| Component | Target | Previous Prod Digest | Candidate Digest | Status |',
                  '| :--- | :--- | :--- | :--- | :---: |'
                );
                const workloadCounts = new Map();
                for (const rec of releaseRecords) {
                  workloadCounts.set(rec.workload, (workloadCounts.get(rec.workload) || 0) + 1);
                }
                for (const rec of releaseRecords) {
                  const compoundKey = `${rec.workload}/${rec.container}`;
                  const multiContainer = (workloadCounts.get(rec.workload) || 0) > 1;
                  const key = imagePromotion === 'chart-values' && !multiContainer
                    ? rec.workload
                    : compoundKey;
                  const prevDig = (baseline.digests && (
                    baseline.digests[compoundKey] ||
                    (!multiContainer ? baseline.digests[rec.workload] : '')
                  )) || '';
                  const changed = !prevDig || prevDig !== rec.digest;
                  const statusBadge = changed ? '🔄 Updated' : '➖ Unchanged';
                  lines.push(
                    `| \`${escapeCell(rec.component)}\` | \`${escapeCell(key)}\` | ${shortDigest(prevDig)} | ${shortDigest(rec.digest)} | ${statusBadge} |`
                  );
                }
              }

              if (commitLines.length > 0) {
                lines.push(
                  '',
                  `### 📝 Commits Since Current Production (${totalCommits})`,
                  '',
                  ...commitLines
                );
                if (totalCommits > commitLines.length && resolvedPrevSha) {
                  lines.push(
                    `- _…and ${totalCommits - commitLines.length} earlier commit(s) — [view full diff](${serverUrl}/${srcRepoFull}/compare/${resolvedPrevSha}...${sha})_`
                  );
                }
              }

              lines.push(
                '',
                '---',
                `Source: ${srcRepoFull}@${sha}`,
                `Workflow: ${serverUrl}/${srcRepoFull}/actions/runs/${context.runId}`,
                `Source-Repository: ${srcRepoFull}`,
                `Source-Revision: ${sha}`
              );
              return lines.join('\n');
            };

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              base: baseBranch,
              state: 'open',
              per_page: 100,
            });

            const targetRepoFull = `${owner}/${repo}`.toLowerCase();
            const isSameRepoPr = (pr) => {
              const hr = pr.head && pr.head.repo && pr.head.repo.full_name;
              return !hr || hr.toLowerCase() === targetRepoFull;
            };

            let currentPr = null;
            if (hasChanges) {
              const title = `chore(${app}): promote ${shortSha} to production`;
              const body = buildPrBody();
              const existingCanonical = openPrs.find((pr) => isSameRepoPr(pr) && pr.head && pr.head.ref === head);
              if (existingCanonical) {
                let prAlreadyAhead = false;
                if (process.env.EXPLICIT_SOURCE_REVISION !== 'true' && appToken && existingCanonical.body) {
                  const markerMatch = existingCanonical.body.match(/<!--\s*gitops-promote:\s*(\{[^\n]*?\})\s*-->/);
                  if (markerMatch) {
                    try {
                      const marker = JSON.parse(markerMatch[1]);
                      const prevPrSha = String(marker.sourceRevision || '');
                      if (/^[0-9a-f]{40}$/.test(prevPrSha) && prevPrSha !== sha) {
                        const chk = await fetch(
                          `${apiUrl}/repos/${srcRepoFull}/compare/${encodeURIComponent(sha)}...${encodeURIComponent(prevPrSha)}`,
                          { headers: { Authorization: `Bearer ${appToken}`, Accept: 'application/vnd.github+json' } }
                        );
                        if (chk.ok) {
                          const chkData = await chk.json();
                          if (chkData.status === 'ahead') {
                            prAlreadyAhead = true;
                          }
                        }
                      }
                    } catch (_err) {}
                  }
                }
                if (prAlreadyAhead) {
                  currentPr = existingCanonical;
                  core.info(`Skipping PR metadata downgrade on #${currentPr.number}: PR already tracks newer descendant revision.`);
                } else if (existingCanonical.title !== title || (existingCanonical.body || '') !== body) {
                  const updated = await github.rest.pulls.update({
                    owner,
                    repo,
                    pull_number: existingCanonical.number,
                    title,
                    body,
                  });
                  currentPr = updated.data;
                  core.info(`Updated existing rolling promotion PR #${currentPr.number} (${head}) to ${shortSha}.`);
                } else {
                  currentPr = existingCanonical;
                  core.info(`Existing rolling promotion PR #${currentPr.number} (${head}) is already up to date.`);
                }
              } else {
                const created = await github.rest.pulls.create({
                  owner,
                  repo,
                  head,
                  base: baseBranch,
                  title,
                  body,
                });
                currentPr = created.data;
                core.info(`Created rolling promotion PR #${currentPr.number} (${head}) for ${shortSha}.`);
              }
            }

            const prefix = `promote/${app}/`;
            for (const pr of openPrs) {
              if (!isSameRepoPr(pr)) continue;
              const prRef = (pr.head && pr.head.ref) || '';
              if (!prRef.startsWith(prefix)) continue;
              if (hasChanges && currentPr && pr.number === currentPr.number) continue;
              const note = currentPr
                ? `Superseded by rolling promotion PR #${currentPr.number} (\`${shortSha}\`).`
                : `Closing automatically: \`${baseBranch}\` already references the latest validated image digests (\`${shortSha}\`).`;
              try {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: note });
                await github.rest.pulls.update({ owner, repo, pull_number: pr.number, state: 'closed' });
              } catch (err) {
                core.warning(`Could not close superseded PR #${pr.number} (${prRef}): ${err.message}`);
              }
            }

            try {
              const refs = await github.paginate(github.rest.git.listMatchingRefs, {
                owner,
                repo,
                ref: `heads/${prefix}`,
              });
              const keepRef = hasChanges && currentPr ? `refs/heads/${head}` : '';
              for (const r of refs) {
                if (!r.ref || !r.ref.startsWith(`refs/heads/${prefix}`)) continue;
                if (r.ref === keepRef) continue;
                const prRef = r.ref.replace(/^refs\/heads\//, '');
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${prRef}` });
                } catch (err) {
                  core.warning(`Could not delete stale branch ${prRef}: ${err.message}`);
                }
              }
            } catch (err) {
              core.warning(`Could not enumerate stale ${prefix}* branches: ${err.message}`);
            }
