name: Helm Lint and Guardrails Validation

on:
  workflow_call:
    inputs:
      CHART_PATH:
        description: Path to Helm chart
        required: false
        type: string
        default: 'chart'
      VALUES_FILE:
        description: Values file to validate (e.g. values-prd.yaml)
        required: false
        type: string
        default: 'values-prd.yaml'
      RUNS_ON:
        description: Runner type
        required: false
        type: string
        default: 'arc-k3s'

jobs:
  helm-validation:
    name: Helm Lint & Guardrails
    runs-on: arc-k3s
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'latest'

      - name: Verify Chart Structure
        run: |
          if [ ! -f "${{ inputs.CHART_PATH }}/Chart.yaml" ]; then
            echo "::error::Chart.yaml not found at ${{ inputs.CHART_PATH }}/Chart.yaml"
            exit 1
          fi

          if [ ! -f "${{ inputs.CHART_PATH }}/${{ inputs.VALUES_FILE }}" ]; then
            echo "::warning::Specified values file ${{ inputs.VALUES_FILE }} not found at ${{ inputs.CHART_PATH }}"
          fi

      - name: Use mounted Zot credentials when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /run/secrets/zot/config.json ]; then
            printf 'HELM_REGISTRY_CONFIG=%s\n' /run/secrets/zot/config.json >> "$GITHUB_ENV"
          fi

      - name: Helm Dependency Build
        run: |
          helm dependency build "${{ inputs.CHART_PATH }}" || true

      - name: Helm Lint
        run: |
          echo "Running helm lint on ${{ inputs.CHART_PATH }}..."
          helm lint "${{ inputs.CHART_PATH }}"

      - name: Helm Template Validation
        run: |
          VALUES_OPT=""
          if [ -f "${{ inputs.CHART_PATH }}/${{ inputs.VALUES_FILE }}" ]; then
            VALUES_OPT="-f ${{ inputs.CHART_PATH }}/${{ inputs.VALUES_FILE }}"
          fi

          echo "Rendering helm template with $VALUES_OPT..."
          helm template test-release "${{ inputs.CHART_PATH }}" $VALUES_OPT > /dev/null
          echo "Helm template successfully rendered without syntax errors!"

      - name: Guardrails - Validate YAML Syntax
        uses: mikefarah/yq@557dcb87b8efe786f89a12c09e9046b4753ab72e # v4.44.1
        with:
          cmd: yq eval '.' "${{ inputs.CHART_PATH }}/Chart.yaml" > /dev/null
