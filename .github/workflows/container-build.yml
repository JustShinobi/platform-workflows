name: Build and Push Container Image

on:
  workflow_call:
    inputs:
      IMAGE_NAME:
        description: Target image name
        required: true
        type: string
      DOCKERFILE_PATH:
        description: Path to Dockerfile
        required: false
        type: string
        default: 'Dockerfile'
      REGISTRY_URL:
        description: Target Container Registry URL
        required: false
        type: string
        default: 'registry.lan.kyo.ninja'
      IMAGE_TAG:
        description: Additional tag for the image
        required: false
        type: string
        default: 'latest'
      RUNS_ON:
        description: Runner type
        required: false
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read

jobs:
  build-and-push-container:
    name: Build and Push Container Image
    runs-on: ${{ inputs.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Use mounted Zot credentials when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -s /run/secrets/zot/config.json ]; then
            install -d -m 0700 "${HOME}/.docker"
            install -m 0600 /run/secrets/zot/config.json "${HOME}/.docker/config.json"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.REGISTRY_URL }}/${{ inputs.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ inputs.IMAGE_TAG }}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ inputs.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
