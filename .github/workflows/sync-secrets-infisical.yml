name: Sync Secrets to Infisical

on:
  workflow_call:
    inputs:
      PROJECT_ID:
        description: Infisical Project ID (defaults to platform-infra)
        required: false
        type: string
        default: '31a72ef6-959a-461f-8549-33b6040f4b8d'
      ENVIRONMENT:
        description: Target Environment (prod, stg, dev)
        required: false
        type: string
        default: 'prod'
      SECRET_PATH:
        description: Secret Path (e.g. /my-service/runtime)
        required: true
        type: string
      ENV_CONTENT:
        description: Secrets in KEY=VALUE (.env format)
        required: true
        type: string
      INFISICAL_DOMAIN:
        description: Infisical Domain URL
        required: false
        type: string
        default: 'https://infisical.lan.kyo.ninja'
    secrets:
      INFISICAL_CLIENT_ID:
        required: false
      INFISICAL_CLIENT_SECRET:
        required: false

  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: 'Target Environment'
        required: true
        type: choice
        options:
          - prod
          - stg
          - dev
        default: 'prod'
      SECRET_PATH:
        description: 'Secret Path in Infisical (e.g. /my-app/runtime)'
        required: true
        type: string
      ENV_CONTENT:
        description: 'Paste your .env content (KEY=VALUE lines)'
        required: true
        type: string
      PROJECT_ID:
        description: 'Infisical Project ID'
        required: false
        type: string
        default: '31a72ef6-959a-461f-8549-33b6040f4b8d'

jobs:
  sync-secrets:
    name: Sync Secrets to Infisical
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Push Secrets to Infisical
        env:
          INFISICAL_DOMAIN: ${{ inputs.INFISICAL_DOMAIN || 'https://infisical.lan.kyo.ninja' }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID || '9ada7bb4-d58a-473d-8be1-3048fe27c3ef' }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET || 'ad9fea111cc66cff94e2877d5d17509cfa27e2da8412df645f4f73efa40d10de' }}
          PROJECT_ID: ${{ inputs.PROJECT_ID }}
          ENVIRONMENT: ${{ inputs.ENVIRONMENT }}
          SECRET_PATH: ${{ inputs.SECRET_PATH }}
          ENV_CONTENT: ${{ inputs.ENV_CONTENT }}
        run: |
          python3 - << 'EOF'
          import os, sys, json, ssl, urllib.request, subprocess

          ctx = ssl._create_unverified_context()
          domain = os.environ['INFISICAL_DOMAIN'].rstrip('/')
          client_id = os.environ['INFISICAL_CLIENT_ID']
          client_secret = os.environ['INFISICAL_CLIENT_SECRET']
          project_id = os.environ['PROJECT_ID']
          env = os.environ['ENVIRONMENT']
          secret_path = os.environ['SECRET_PATH']
          if not secret_path.startswith('/'):
              secret_path = '/' + secret_path
          env_content = os.environ['ENV_CONTENT']

          # 1. Login via Universal Auth
          auth_data = json.dumps({'clientId': client_id, 'clientSecret': client_secret}).encode('utf-8')
          req = urllib.request.Request(f'{domain}/api/v1/auth/universal-auth/login', data=auth_data, headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, context=ctx) as resp:
              token = json.loads(resp.read().decode())['accessToken']

          # 2. Parse secrets from ENV_CONTENT
          secrets_to_push = {}
          for line in env_content.strip().splitlines():
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              if '=' in line:
                  key, val = line.split('=', 1)
                  key = key.strip()
                  val = val.strip().strip('"').strip("'")
                  if key:
                      secrets_to_push[key] = val

          if not secrets_to_push:
              print("No valid key-value pairs found in input.")
              sys.exit(0)

          # 3. Ensure target folder exists using infisical CLI
          path_parts = [p for p in secret_path.strip('/').split('/') if p]
          current_path = "/"
          for part in path_parts:
              folder_data = json.dumps({
                  'workspaceId': project_id,
                  'environment': env,
                  'folderName': part,
                  'path': current_path
              }).encode('utf-8')
              req = urllib.request.Request(f'{domain}/api/v1/folders', data=folder_data, headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}, method='POST')
              try:
                  with urllib.request.urlopen(req, context=ctx) as resp:
                      pass
              except Exception:
                  pass
              current_path = current_path.rstrip('/') + '/' + part

          # 4. Set secrets via CLI
          env_file_path = '/tmp/secrets.env'
          with open(env_file_path, 'w') as f:
              for k, v in secrets_to_push.items():
                  f.write(f'{k}={v}\n')

          cmd = [
              'infisical', 'secrets', 'set',
              f'--file={env_file_path}',
              '--domain', domain,
              '--token', token,
              '--projectId', project_id,
              '--env', env,
              '--path', secret_path,
              '--silent'
          ]
          subprocess.run(cmd, check=True)
          os.remove(env_file_path)

          print(f"✅ Successfully synced {len(secrets_to_push)} secrets to Infisical:")
          print(f"   Project ID: {project_id}")
          print(f"   Environment: {env}")
          print(f"   Path: {secret_path}")
          print(f"   Keys updated: {', '.join(sorted(secrets_to_push.keys()))}")
          EOF
